<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Memória — Arena da Palavra</title>

<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
/* Espaçamentos em pixels: porcentagem no sentido vertical se calcula
   sobre a altura do container, que aqui só existe depois das cartas. */

.faixa{
  display:flex;align-items:stretch;gap:8px;margin-bottom:12px;flex-wrap:wrap;
}
.faixa .lado{
  flex:1;min-width:74px;text-align:center;padding:9px 6px;border-radius:9px;
  background:var(--surface);border:1px solid var(--linha);
  transition:border-color .2s, background .2s;
}
.faixa .lado.vez{border-color:var(--cor-lado);background:color-mix(in srgb, var(--cor-lado) 15%, var(--surface))}
.faixa .lado .quem{
  display:block;font-family:'Cinzel',serif;font-size:12px;color:var(--ink-dim);
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.faixa .lado.vez .quem{color:var(--cor-lado)}
.faixa .lado .pontos{font-size:23px;line-height:1;font-family:'Cinzel',serif;color:var(--cor-lado);font-variant-numeric:tabular-nums}

/* A largura máxima muda com o número de colunas: sem isso, uma mesa de
   2 colunas gera cartas gigantes com um texto minúsculo no meio. */
.mesa{display:grid;gap:7px;margin:0 auto}
.mesa.c2{grid-template-columns:repeat(2,1fr);max-width:300px}
.mesa.c3{grid-template-columns:repeat(3,1fr);max-width:390px}
.mesa.c4{grid-template-columns:repeat(4,1fr);max-width:445px}
@media (max-width:360px){ .mesa{gap:5px} }

/* A carta é um div, e não um button: dentro de um botão a altura
   percentual dos filhos não tem contra o que se medir, e a folha
   colapsa — a carta fica sem fundo e sem moldura.
   A folha também não usa altura percentual: ela é item de grade,
   e item de grade já se estica sozinho para preencher a área. */
.carta{
  aspect-ratio:4/5;background:none;border:none;padding:0;
  display:grid;perspective:700px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.carta[aria-disabled="true"]{cursor:default}
.folha{
  grid-area:1 / 1;position:relative;
  transform-style:preserve-3d;transition:transform .38s ease;
}
.carta.aberta .folha{transform:rotateY(180deg)}
.face{
  position:absolute;top:0;right:0;bottom:0;left:0;border-radius:9px;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  display:grid;place-items:center;padding:5px;overflow:hidden;
}
.txt{
  display:block;width:100%;max-height:100%;
  line-height:1.14;overflow-wrap:anywhere;hyphens:auto;
}
.verso{
  background:var(--surface);border:1px solid var(--gold);
  color:var(--gold);opacity:.9;
}
.verso i{
  display:block;width:28%;aspect-ratio:1;
  border:1.5px solid var(--gold);opacity:.75;
  transform:rotate(45deg);border-radius:3px;
}
.carta:not([aria-disabled="true"]):hover .verso{background:var(--surface-2)}
.frente{
  background:var(--surface-2);border:1px solid var(--linha);
  transform:rotateY(180deg);text-align:center;
}
.frente.pergunta{color:var(--ink)}
.frente.resposta{color:var(--gold-soft);font-family:'Cinzel',serif}
/* Tamanhos de reserva. O valor de verdade é calculado por medição
   em ajustarTexto(), que faz a letra crescer até encostar nas bordas. */
.t1{font-size:19px}
.t2{font-size:16px}
.t3{font-size:13px}
.t4{font-size:11px}

.carta.achada .frente{
  border-color:var(--esmeralda);
  background:color-mix(in srgb, var(--esmeralda) 26%, var(--surface-2));
}
.carta.errou .frente{border-color:var(--carmim-claro)}
@media (prefers-reduced-motion:reduce){ .folha{transition:none} }

.ultimo{
  margin:14px auto 0;max-width:430px;min-height:44px;
  padding:10px 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--linha);
  border-left:4px solid var(--esmeralda);
  font-size:16px;line-height:1.35;display:none;
}
.ultimo.aparece{display:block}
.ultimo b{color:var(--gold-soft)}
.ultimo small{display:block;color:var(--ink-dim);font-size:14px;margin-top:3px}

.desfecho{text-align:center;margin-top:14px}
.desfecho .frase{font-family:'Cinzel',serif;font-size:19px;margin:0 0 10px}
</style>
</head>
<body>

<header></header>

<main>

<!-- ============ PREPARO ============ -->
<section class="tela ativa" id="telaPreparo">
  <div class="bloco">
    <h2>Quem joga</h2>
    <div class="escolhas" id="escModo"></div>
  </div>

  <div class="bloco">
    <h2>Tamanho da mesa</h2>
    <div class="escolhas" id="escTamanho"></div>
    <p class="legenda" style="margin:14px 0 0" id="legTamanho">—</p>
  </div>

  <div class="bloco">
    <h2>Os jogadores</h2>
    <div id="listaJogadores"></div>
  </div>

  <div id="painelSala"></div>

  <button class="principal" id="btnComecar">Começar</button>
</section>

<!-- ============ JOGO ============ -->
<section class="tela" id="telaJogo">
  <div class="faixa" id="faixa"></div>
  <div class="mesa" id="mesa"></div>
  <div class="ultimo" id="ultimo"></div>
  <p class="aviso" id="aviso">—</p>
  <button class="secundario" id="btnSair">Encerrar e voltar</button>
</section>

<!-- ============ FIM ============ -->
<section class="tela" id="telaFim">
  <div class="fim">
    <h2 id="fimTitulo">—</h2>
    <p class="legenda" id="fimSub">—</p>
    <ol class="placar-lista" id="placarFinal"></ol>
    <button class="principal" id="btnDeNovo">Jogar de novo</button>
    <button class="secundario" id="btnVoltarPreparo">Mudar as opções</button>
  </div>
</section>

</main>

<script src="perguntas.js"></script>
<script src="comum.js"></script>
<script src="sala.js"></script>
<script>
"use strict";

/* =========================================================
   MEMÓRIA DE PARES — Arena da Palavra
   Cada par é uma pergunta e a sua resposta. Aqui a pergunta
   não interrompe o jogo: ela é o próprio tabuleiro.
   v1.0.0
   ========================================================= */

const VERSAO = "1.5.0";

/* Mesa maior exige pergunta mais curta, senão o texto não cabe na carta. */
const MESAS = {
  pequena: {pares:4,  colunas:2, limite:70, rotulo:"8 cartas"},
  media:   {pares:6,  colunas:3, limite:55, rotulo:"12 cartas"},
  grande:  {pares:8,  colunas:4, limite:45, rotulo:"16 cartas"}
};

/* De que tipo é a resposta. Sortear pares do mesmo tipo obriga a saber
   qual resposta vai com qual pergunta — não basta lembrar onde ela está. */
function tipoDaResposta(q){
  const k = q.p.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const r = q.o[q.c];
  if(/^\s*\d/.test(r) || /^(quantos|quantas|com quantos|por quantos|quanto)/.test(k)) return "numero";
  if(/\btribo\b/.test(k)) return "tribo";
  if(/(qual|que) (livro|carta|epistola)|em qual (livro|carta)/.test(k)) return "livro";
  if(/(qual|que) profeta/.test(k)) return "profeta";
  if(/(qual|que) rei|qual governador/.test(k)) return "rei";
  if(/(qual|que) juiz/.test(k)) return "juiz";
  if(/\b(cidade|local|lugar|terra|regiao|monte|ilha|rio)\b/.test(k)) return "lugar";
  if(/qual animal|qual ave|quais aves|quais animais/.test(k)) return "animal";
  if(/ocupacao|profissao|oficio/.test(k)) return "ocupacao";
  if(/qual mulher|quem foi a mulher|qual (irma|esposa|mae|profetisa|nora)|quem foi a (mae|avo|bisavo)/.test(k)) return "mulher";
  if(/^(o que|com que|de que (madeira|material))/.test(k)) return "objeto";
  return "pessoa";
}

/* o quanto a máquina se lembra das cartas que já viu */
const MEMORIA_MAQUINA = {1:0.35, 2:0.65, 3:0.92};

const CORES_JOGADOR = ["#D4565F", "#C9A227", "#2A5B9C", "#2E6B4F"];

const REGRAS = `
  <h2>Como se joga</h2>

  <h3>O objetivo</h3>
  <p>Achar os pares. Só que aqui um par não são duas figuras iguais: é uma pergunta bíblica e a sua resposta.</p>

  <h3>A jogada</h3>
  <p>Vire duas cartas. Se uma for a pergunta e a outra a resposta certa, o par fica aberto e você joga de novo. Se não combinarem, as duas voltam a virar e a vez passa.</p>

  <h3>Por que este é diferente dos outros</h3>
  <p>Nos outros jogos da Arena a pergunta interrompe a jogada. Aqui ela é o tabuleiro inteiro — você aprende olhando, sem parar para responder nada.</p>

  <h3>Do médio para cima, todas as respostas são do mesmo tipo</h3>
  <p>Numa mesa misturada dá para ligar a resposta à pergunta só pela categoria: se só há um nome de pessoa, ele responde à única pergunta sobre gente. A partir do nível médio, as respostas da mesa são todas do mesmo tipo — só reis, só cidades, só profetas. Aí lembrar onde a carta está não basta: é preciso saber qual vai com qual.</p>

  <h3>O tamanho da mesa</h3>
  <p>Mesa pequena tem 8 cartas e cabe pergunta comprida. Mesa grande tem 16 e só entram perguntas curtas, senão o texto não cabe na carta.</p>

  <h3>A máquina</h3>
  <p>Ela esquece de propósito. No fácil guarda pouco mais de um terço das cartas que vê; no difícil, quase todas. Uma máquina com memória perfeita ganharia sempre, e não teria graça.</p>
`;

let cfg = { modo:"solo", tamanho:"media", jogadores:[] };
let jogo = null;

/* ---------------------------------------------------------
   PREPARO
   --------------------------------------------------------- */

function qtdJogadores(){
  if(cfg.modo === "solo") return 1;
  if(cfg.modo === "maquina") return 2;
  return Number(cfg.modo);
}

function montarPreparo(){
  UI.escolhas($("#escModo"),
    [{valor:"solo", rotulo:"Sozinho"}, {valor:"maquina", rotulo:"Máquina"},
     {valor:"2", rotulo:"2"}, {valor:"3", rotulo:"3"}, {valor:"4", rotulo:"4"}],
    cfg.modo, v => { cfg.modo = v; montarPreparo(); });

  UI.escolhas($("#escTamanho"),
    Object.keys(MESAS).map(k => ({valor:k, rotulo:MESAS[k].rotulo})),
    cfg.tamanho, v => { cfg.tamanho = v; montarPreparo(); });

  const m = MESAS[cfg.tamanho];
  $("#legTamanho").textContent = m.pares + " pares. " +
    (cfg.tamanho === "grande"
      ? "Só entram perguntas curtas, para o texto caber na carta."
      : cfg.tamanho === "pequena"
        ? "Cartas grandes, boas para criança pequena."
        : "O tamanho que eu usaria por padrão.");

  const anteriores = cfg.jogadores;
  const lista = $("#listaJogadores");
  lista.innerHTML = "";
  cfg.jogadores = [];

  for(let i = 0; i < qtdJogadores(); i++){
    const ehMaquina = cfg.modo === "maquina" && i === 1;
    const velho = anteriores[i] || {};
    const j = {
      nome: ehMaquina ? "Máquina" : (velho.nome && velho.nome !== "Máquina" ? velho.nome : (i === 0 ? "Você" : "Jogador " + (i+1))),
      nivel: velho.nivel || 2,
      tipo: ehMaquina ? "maquina" : "humano",
      cor: CORES_JOGADOR[i],
      pontos: 0
    };

    const linha = document.createElement("div");
    linha.className = "jogador-linha";
    const bola = document.createElement("span");
    bola.className = "bolinha"; bola.style.background = j.cor;

    const nome = document.createElement("input");
    nome.type = "text"; nome.value = j.nome; nome.maxLength = 16;
    nome.disabled = ehMaquina;
    nome.setAttribute("aria-label", "Nome do jogador " + (i+1));
    nome.addEventListener("input", () => { j.nome = nome.value.trim() || ("Jogador " + (i+1)); });

    const nivel = document.createElement("select");
    nivel.setAttribute("aria-label", ehMaquina ? "Memória da máquina" : "Nível das perguntas");
    [[1,"Fácil"],[2,"Médio"],[3,"Difícil"]].forEach(([v,t]) => {
      const o = document.createElement("option"); o.value = v; o.textContent = t;
      if(v === j.nivel) o.selected = true; nivel.appendChild(o);
    });
    nivel.addEventListener("change", () => { j.nivel = Number(nivel.value); });

    linha.append(bola, nome, nivel);
    lista.appendChild(linha);
    cfg.jogadores.push(j);
  }
}

/* ---------------------------------------------------------
   MONTAR A MESA
   --------------------------------------------------------- */

function embaralhar(a){
  for(let i = a.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [a[i], a[k]] = [a[k], a[i]];
  }
  return a;
}

function classeTexto(t){
  if(t.length <= 16) return "t1";
  if(t.length <= 32) return "t2";
  if(t.length <= 50) return "t3";
  return "t4";
}

function sortearPares(){
  const m = MESAS[cfg.tamanho];
  const nivel = cfg.jogadores[0].nivel;

  const serve = q => q.p.length <= m.limite && q.o[q.c].length <= 22;
  let pool = PERGUNTAS.filter(q => q.n === nivel && serve(q));
  if(pool.length < m.pares) pool = PERGUNTAS.filter(serve);

  /* Duas cartas de resposta com o mesmo texto tornam o par ambíguo:
     "Patmos" respondendo a duas perguntas diferentes na mesma mesa
     deixa o jogo sem solução. Esta peneira escolhe respeitando isso. */
  const semRepetir = (lista, quantas) => {
    const chave = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                        .toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
    const fora = [], usadas = [], perguntas = [];
    for(const q of lista){
      if(fora.length === quantas) break;
      const r = chave(q.o[q.c]), p = chave(q.p);
      if(usadas.some(u => u === r || u.includes(r) || r.includes(u))) continue;
      if(perguntas.some(u => u === p)) continue;
      usadas.push(r); perguntas.push(p); fora.push(q);
    }
    return fora.length === quantas ? fora : null;
  };

  let escolhidas = null;

  // do médio para cima, tenta uma mesa inteira do mesmo tipo de resposta:
  // aí não adianta lembrar onde a carta está, é preciso saber qual é qual
  if(nivel >= 2){
    const porTipo = {};
    pool.forEach(q => { const t = tipoDaResposta(q); (porTipo[t] = porTipo[t] || []).push(q); });
    const cheios = embaralhar(Object.keys(porTipo).filter(t => porTipo[t].length >= m.pares));
    for(const t of cheios){
      escolhidas = semRepetir(embaralhar(porTipo[t].slice()), m.pares);
      if(escolhidas) break;
    }
  }
  if(!escolhidas) escolhidas = semRepetir(embaralhar(pool.slice()), m.pares);
  if(!escolhidas) escolhidas = semRepetir(embaralhar(PERGUNTAS.slice()), m.pares);
  if(!escolhidas) escolhidas = embaralhar(pool.slice()).slice(0, m.pares);

  return escolhidas.map((q, i) => ({par:i, pergunta:q.p, resposta:q.o[q.c], ref:q.r}));
}

function comecar(){
  const m = MESAS[cfg.tamanho];
  const pares = sortearPares();

  const cartas = [];
  pares.forEach(p => {
    cartas.push({par:p.par, tipo:"p", texto:p.pergunta, ref:p.ref, resposta:p.resposta});
    cartas.push({par:p.par, tipo:"r", texto:p.resposta, ref:p.ref, pergunta:p.pergunta});
  });
  embaralhar(cartas);

  cfg.jogadores.forEach(j => j.pontos = 0);
  jogo = {
    cartas,
    abertas: [],
    achadas: new Set(),
    vez: 0,
    fase: "escolher",
    tentativas: 0,
    inicio: Date.now(),
    memoria: new Map()      // o que a máquina guardou: índice -> par
  };

  UI.trocarTela("telaJogo");
  $("#ultimo").classList.remove("aparece");
  montarMesa(melhorColunas(cartas.length));
  montarFaixa();
  publicar();
  seguirVez();
}

function montarMesa(colunas){
  const mesa = $("#mesa");
  mesa.className = "mesa c" + colunas;
  mesa.innerHTML = "";

  jogo.cartas.forEach((c, i) => {
    const b = document.createElement("div");
    b.className = "carta";
    b.dataset.i = i;
    b.setAttribute("role", "button");
    b.setAttribute("tabindex", "0");
    b.setAttribute("aria-label", "Carta " + (i+1));

    const folha = document.createElement("span");
    folha.className = "folha";

    const verso = document.createElement("span");
    verso.className = "face verso";
    verso.appendChild(document.createElement("i"));

    const frente = document.createElement("span");
    frente.className = "face frente " + (c.tipo === "p" ? "pergunta " : "resposta ");
    const txt = document.createElement("span");
    txt.className = "txt " + classeTexto(c.texto);
    txt.textContent = c.texto;
    frente.appendChild(txt);

    folha.append(verso, frente);
    b.appendChild(folha);
    b.addEventListener("click", () => virar(i));
    b.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); virar(i); }
    });
    mesa.appendChild(b);
  });
  ajustarMesa(colunas);
  ajustarTodos();
}

/* Limita a mesa também pela altura disponível.
   Com poucas colunas, calcular só pela largura deixa a carta enorme e
   a mesa passa da tela: era preciso rolar para ver as de baixo. Aqui a
   largura da mesa é a menor entre o limite da coluna e o que faz todas
   as fileiras caberem na altura que sobra. */
/* Escolhe quantas colunas rendem a maior carta nesta tela.
   Duas colunas com oito cartas parece generoso, mas gera quatro
   fileiras altas que não cabem no celular em pé — e a carta acaba
   menor do que ficaria com três colunas. */
function melhorColunas(total){
  const mesa = $("#mesa");
  const larguraPai = (mesa.parentElement ? mesa.parentElement.clientWidth : 0) || 360;
  const topo = mesa.getBoundingClientRect().top;
  const alturaUtil = Math.max(220, window.innerHeight - (topo > 0 ? topo : 300) - 176);
  const vao = window.innerWidth <= 360 ? 5 : 7;

  let melhor = 3, maior = 0;
  [2, 3, 4].forEach(c => {
    const fileiras = Math.ceil(total / c);
    const porLargura = (Math.min(larguraPai, 460) - (c - 1) * vao) / c;
    const porAltura  = ((alturaUtil - (fileiras - 1) * vao) / fileiras) / 1.25;
    const lado = Math.min(porLargura, porAltura);
    if(lado > maior){ maior = lado; melhor = c; }
  });
  return melhor;
}

function ajustarMesa(colunas){
  const mesa = $("#mesa");
  const cartas = mesa.children.length;
  if(!cartas) return;
  const fileiras = Math.ceil(cartas / colunas);
  const vao = window.innerWidth <= 360 ? 5 : 7;

  const topo = mesa.getBoundingClientRect().top;
  if(topo <= 0) return;                       // ainda sem layout
  const abaixo = 176;                         // aviso, último par e botão de sair
  const alturaUtil = Math.max(220, window.innerHeight - topo - abaixo);

  // altura da carta = largura * 1.25 (proporção 4 por 5)
  const alturaCarta = (alturaUtil - (fileiras - 1) * vao) / fileiras;
  const larguraCarta = alturaCarta / 1.25;
  const porAltura = Math.floor(larguraCarta * colunas + (colunas - 1) * vao);

  const tetos = {2:300, 3:390, 4:460};
  mesa.style.maxWidth = Math.max(150, Math.min(tetos[colunas] || 460, porAltura)) + "px";
}

/* Faz a letra de cada carta crescer até o texto encostar nas bordas.
   É busca binária sobre o tamanho da fonte: bem mais confiável do que
   adivinhar quantas letras cabem, porque leva em conta a fonte de verdade,
   a largura real da carta e o tamanho da tela. */
function ajustarTexto(frente){
  const txt = $(".txt", frente);
  if(!txt) return;
  const alturaUtil = frente.clientHeight - 10;
  const larguraUtil = frente.clientWidth - 10;
  if(alturaUtil <= 0 || larguraUtil <= 0) return;   // ainda sem layout: fica o tamanho de reserva

  let menor = 7, maior = 26;
  for(let i = 0; i < 8; i++){
    const meio = (menor + maior) / 2;
    txt.style.fontSize = meio + "px";
    const cabe = txt.scrollHeight <= alturaUtil && txt.scrollWidth <= larguraUtil + 1;
    if(cabe) menor = meio; else maior = meio;
  }
  txt.style.fontSize = menor.toFixed(1) + "px";
}

function ajustarTodos(){
  $$("#mesa .frente").forEach(ajustarTexto);
}

let releitura = null;
window.addEventListener("resize", () => {
  clearTimeout(releitura);
  releitura = setTimeout(() => {
    if(!jogo) return;
    // ao girar o aparelho, o melhor número de colunas pode mudar
    const colunas = melhorColunas(jogo.cartas.length);
    const abertas = $$("#mesa .carta.aberta").map(c => Number(c.dataset.i));
    const achadas = $$("#mesa .carta.achada").map(c => Number(c.dataset.i));
    montarMesa(colunas);
    $$("#mesa .carta").forEach((c, i) => {
      if(abertas.includes(i)) c.classList.add("aberta");
      if(achadas.includes(i)) c.classList.add("achada");
    });
    travar(jogo.fase !== "escolher");
    ajustarTodos();
  }, 180);
});

function montarFaixa(){
  const f = $("#faixa");
  f.innerHTML = "";
  cfg.jogadores.forEach((j, i) => {
    const d = document.createElement("div");
    d.className = "lado";
    d.style.setProperty("--cor-lado", j.cor);
    d.innerHTML = '<span class="quem"></span><span class="pontos">0</span>';
    $(".quem", d).textContent = j.nome;
    f.appendChild(d);
  });
  atualizarFaixa();
}

function atualizarFaixa(){
  $$("#faixa .lado").forEach((d, i) => {
    $(".pontos", d).textContent = cfg.jogadores[i].pontos;
    d.classList.toggle("vez", i === jogo.vez && jogo.fase !== "fim");
  });
}

function avisar(t){ $("#aviso").textContent = t || ""; }
function atual(){ return cfg.jogadores[jogo.vez]; }

/* ---------------------------------------------------------
   AS JOGADAS
   --------------------------------------------------------- */

function seguirVez(){
  if(jogo.fase === "fim") return;
  jogo.fase = "escolher";
  atualizarFaixa();
  travar(false);
  const j = atual();
  if(Sala.ativa() && !souDaVez()){
    travar(true);
    return avisar("Aguardando " + j.nome + " no outro aparelho…");
  }
  if(j.tipo === "maquina"){
    travar(true);
    avisar(j.nome + " está lembrando…");
    setTimeout(jogadaDaMaquina, 900);
  } else {
    avisar(cfg.jogadores.length === 1
      ? "Vire duas cartas."
      : j.nome + ", vire duas cartas.");
  }
}

function travar(t){
  $$("#mesa .carta").forEach((b, i) => {
    const bloqueada = t || jogo.achadas.has(i) || jogo.abertas.includes(i) || jogo.fase !== "escolher";
    b.setAttribute("aria-disabled", String(bloqueada));
    b.setAttribute("tabindex", bloqueada ? "-1" : "0");
  });
}

function virar(i){
  if(!jogo || jogo.fase !== "escolher") return;
  if(jogo.achadas.has(i) || jogo.abertas.includes(i)) return;
  if(Sala.ativa()){
    if(!souDaVez()) return;
    if(souOJuiz()) return abrirCarta(i);
    return pedirVirada(i);           // o juiz é quem sabe o que tem na carta
  }
  if($$("#mesa .carta")[i].getAttribute("aria-disabled") === "true") return;
  if(atual().tipo === "maquina") return;
  abrirCarta(i);
}

function abrirCarta(i){
  if(!jogo || !jogo.cartas[i]) return;
  if(jogo.achadas.has(i) || jogo.abertas.includes(i)) return;
  if(jogo.abertas.length >= 2) return;      // já há duas na mesa, esperando conferência
  jogo.abertas.push(i);
  $$("#mesa .carta")[i].classList.add("aberta");
  Som.toque();
  lembrar(i);

  if(jogo.abertas.length < 2){ travar(false); publicar(); return; }

  jogo.fase = "conferindo";
  jogo.tentativas++;
  travar(true);
  publicar();
  setTimeout(conferir, 700);
}

/* a máquina guarda o que viu, com a falha de memória do seu nível */
function lembrar(i){
  const maq = cfg.jogadores.find(j => j.tipo === "maquina");
  if(!maq) return;
  if(Math.random() < MEMORIA_MAQUINA[maq.nivel]) jogo.memoria.set(i, jogo.cartas[i].par);
}

function conferir(){
  const [a, b] = jogo.abertas;
  const ca = jogo.cartas[a], cb = jogo.cartas[b];
  if(!ca || !cb){ jogo.abertas = []; return seguirVez(); }
  const combina = ca.par === cb.par && ca.tipo !== cb.tipo;
  const cartas = $$("#mesa .carta");

  if(combina){
    jogo.achadas.add(a); jogo.achadas.add(b);
    cartas[a].classList.add("achada"); cartas[b].classList.add("achada");
    atual().pontos++;
    Som.chegou();
    mostrarUltimo(ca.tipo === "p" ? ca : cb, ca.tipo === "p" ? cb : ca);
    jogo.abertas = [];
    atualizarFaixa();
    publicar();

    if(jogo.achadas.size === jogo.cartas.length){
      jogo.fase = "fim"; publicar();
      return setTimeout(fimDaPartida, 1100);
    }

    avisar(atual().nome + " achou um par e joga de novo.");
    jogo.fase = "escolher";
    return setTimeout(seguirVez, 850);
  }

  cartas[a].classList.add("errou"); cartas[b].classList.add("errou");
  Som.erro();
  avisar("Não combinam.");
  setTimeout(() => {
    cartas[a].classList.remove("aberta","errou");
    cartas[b].classList.remove("aberta","errou");
    jogo.abertas = [];
    if(cfg.jogadores.length > 1) jogo.vez = (jogo.vez + 1) % cfg.jogadores.length;
    publicar();
    seguirVez();
  }, 1400);
}

function mostrarUltimo(cartaP, cartaR){
  jogo.ultimoPar = {p:cartaP.texto, r:cartaR.texto, ref:cartaP.ref};
  mostrarUltimoTexto(jogo.ultimoPar);
}

function mostrarUltimoTexto(u0){
  const cartaP = {texto:u0.p, ref:u0.ref}, cartaR = {texto:u0.r};
  const u = $("#ultimo");
  u.innerHTML = "";
  const linha = document.createElement("span");
  linha.textContent = cartaP.texto + " ";
  const resp = document.createElement("b");
  resp.textContent = cartaR.texto;
  const ref = document.createElement("small");
  ref.textContent = cartaP.ref;
  u.append(linha, resp, ref);
  u.classList.add("aparece");
}

/* ---------------------------------------------------------
   A MÁQUINA
   --------------------------------------------------------- */

function jogadaDaMaquina(){
  const livres = [];
  for(let i = 0; i < jogo.cartas.length; i++)
    if(!jogo.achadas.has(i)) livres.push(i);
  if(livres.length < 2) return;

  // já conhece um par inteiro?
  let a = null, b = null;
  for(const i of livres){
    if(!jogo.memoria.has(i)) continue;
    for(const k of livres){
      if(k === i || !jogo.memoria.has(k)) continue;
      if(jogo.memoria.get(i) === jogo.memoria.get(k)
         && jogo.cartas[i].tipo !== jogo.cartas[k].tipo){ a = i; b = k; break; }
    }
    if(a !== null) break;
  }

  if(a === null){
    const desconhecidas = livres.filter(i => !jogo.memoria.has(i));
    const pool = desconhecidas.length ? desconhecidas : livres;
    a = pool[Math.floor(Math.random() * pool.length)];
  }

  jogo.fase = "escolher";
  abrirCarta(a);

  if(b === null){
    // depois de ver a primeira, procura a parceira na memória
    const par = jogo.cartas[a].par;
    const parceira = livres.find(i => i !== a && !jogo.abertas.includes(i)
      && jogo.memoria.has(i) && jogo.memoria.get(i) === par
      && jogo.cartas[i].tipo !== jogo.cartas[a].tipo);
    const resto = livres.filter(i => i !== a);
    b = parceira !== undefined ? parceira
      : resto.filter(i => !jogo.memoria.has(i)).concat(resto)[0];
  }

  setTimeout(() => {
    if(jogo.fase !== "escolher") return;
    abrirCarta(b);
  }, 800);
}

/* ---------------------------------------------------------
   FIM
   --------------------------------------------------------- */

function fimDaPartida(){
  jogo.fase = "fim";
  atualizarFaixa();
  Som.vitoria();

  const segundos = Math.round((Date.now() - jogo.inicio) / 1000);
  const tempo = segundos >= 60
    ? Math.floor(segundos/60) + "min " + String(segundos%60).padStart(2,"0") + "s"
    : segundos + "s";

  if(cfg.jogadores.length === 1){
    $("#fimTitulo").textContent = "Mesa limpa";
    $("#fimSub").textContent = jogo.tentativas + " tentativas em " + tempo +
      " · o mínimo possível seria " + (jogo.cartas.length / 2);
    $("#placarFinal").innerHTML = "";
  } else {
    const ordem = cfg.jogadores.slice().sort((a,b) => b.pontos - a.pontos);
    const empate = ordem.length > 1 && ordem[0].pontos === ordem[1].pontos;
    $("#fimTitulo").textContent = empate ? "Empate" : ordem[0].nome + " venceu";
    $("#fimSub").textContent = jogo.tentativas + " tentativas em " + tempo;

    const ol = $("#placarFinal");
    ol.innerHTML = "";
    ordem.forEach(j => {
      const li = document.createElement("li");
      const bola = document.createElement("span");
      bola.className = "bolinha"; bola.style.background = j.cor;
      const nome = document.createElement("span"); nome.textContent = j.nome;
      const pts = document.createElement("span");
      pts.style.flex = "0"; pts.style.color = "var(--ink-dim)";
      pts.textContent = j.pontos + (j.pontos === 1 ? " par" : " pares");
      li.append(bola, nome, pts);
      ol.appendChild(li);
    });
  }
  UI.trocarTela("telaFim");
}

/* ---------------------------------------------------------
   SALA — quem embaralha é um só, e as cartas viradas para baixo
   não viajam

   Se o retrato contivesse a mesa inteira, bastaria abrir o inspetor
   do navegador para ler todas as cartas. Então quem abriu a sala
   guarda o baralho e age como juiz: o outro aparelho pede "vire a
   carta 7" e recebe de volta o que estava nela. O que viaja é só o
   que já está à vista.
   --------------------------------------------------------- */

function souDaVez(){ return Sala.minhaVez(jogo ? jogo.vez : 0); }
function souOJuiz(){ return !Sala.ativa() || Sala.meuLugar === 0; }

/* estado público: só as cartas já reveladas levam texto */
function retratar(){
  if(!jogo) return null;
  const visiveis = {};
  jogo.cartas.forEach((c, i) => {
    if(jogo.achadas.has(i) || jogo.abertas.includes(i))
      visiveis[i] = {t:c.texto, k:c.tipo, r:c.ref, p:c.par};
  });
  return {
    colunas: MESAS[cfg.tamanho].colunas,
    total: jogo.cartas.length,
    nomes: cfg.jogadores.map(j => j.nome),
    pontos: cfg.jogadores.map(j => j.pontos),
    vez: jogo.vez, tentativas: jogo.tentativas,
    achadas: [...jogo.achadas], abertas: jogo.abertas.slice(),
    visiveis,
    ultimo: jogo.ultimoPar || null,
    acabou: jogo.fase === "fim"
  };
}

function aplicarEstado(d){
  if(!d) return;
  if(cfg.jogadores.length !== d.nomes.length){
    cfg.jogadores = d.nomes.map((n, i) => ({nome:n, nivel:2, tipo:"humano",
                                            cor:CORES_JOGADOR[i], pontos:d.pontos[i]}));
  }
  cfg.jogadores.forEach((j, i) => { j.nome = d.nomes[i]; j.pontos = d.pontos[i]; });

  const primeira = !jogo;
  if(primeira){
    jogo = {cartas:[], abertas:[], achadas:new Set(), vez:0, fase:"escolher",
            tentativas:0, inicio:Date.now(), memoria:new Map()};
    UI.trocarTela("telaJogo");
    $("#ultimo").classList.remove("aparece");
  }

  // as cartas viradas para baixo chegam vazias, e é assim que tem de ser
  if(jogo.cartas.length !== d.total){
    jogo.cartas = Array.from({length:d.total}, () => ({par:-1, tipo:"p", texto:""}));
  }
  Object.keys(d.visiveis).forEach(k => {
    const v = d.visiveis[k];
    jogo.cartas[k] = {par:v.p, tipo:v.k, texto:v.t, ref:v.r};
  });
  jogo.achadas = new Set(d.achadas);
  jogo.abertas = d.abertas.slice();
  jogo.vez = d.vez;
  jogo.tentativas = d.tentativas;
  jogo.fase = d.acabou ? "fim" : "escolher";

  montarMesa(melhorColunas(d.total));
  jogo.abertas.concat([...jogo.achadas]).forEach(i => {
    const carta = $$("#mesa .carta")[i];
    if(carta) carta.classList.add("aberta");
  });
  [...jogo.achadas].forEach(i => {
    const carta = $$("#mesa .carta")[i];
    if(carta) carta.classList.add("achada");
  });
  if(primeira) montarFaixa(); else atualizarFaixa();
  if(d.ultimo) mostrarUltimoTexto(d.ultimo);

  if(d.acabou) return fimDaPartida();
  seguirVez();
}

function publicar(){ if(souOJuiz()) Sala.enviar(); }

/* quem não é juiz pede ao juiz que vire a carta */
function pedirVirada(i){ Sala.publicar({pedidoVirar:i, de:Sala.meuLugar}); }

function receberDoOutro(d){
  if(!d) return;
  if(d.pedidoVirar !== undefined){
    if(!souOJuiz()) return;
    if(d.de !== jogo.vez) return;          // só quem é da vez pode pedir
    /* Fora da trava de eco de propósito. Este trecho roda dentro da
       aplicação de uma mensagem recebida, e ali nada é publicado — a
       carta virava na tela do juiz e a resposta nunca saía. */
    return setTimeout(() => abrirCarta(d.pedidoVirar), 0);
  }
  aplicarEstado(d);
}

/* ---------------------------------------------------------
   LIGAÇÕES
   --------------------------------------------------------- */

UI.iniciar({ titulo:"Memória", versao:VERSAO, regras:REGRAS, voltar:"index.html" });

Sala.montarPainel($("#painelSala"), {
  jogoId: "memoria", lugares: 2,
  retratar: retratar, aplicar: receberDoOutro,
  aoMudarGente: (n) => { if(jogo && jogo.fase !== "fim" && n < 2) avisar("O outro aparelho saiu da sala."); },
  aoLigar: (lugar) => {
    cfg.modo = "2";
    montarPreparo();
    $("#btnComecar").textContent = lugar === 0 ? "Começar (você embaralha)" : "Esperando o outro aparelho começar";
    $("#btnComecar").disabled = lugar !== 0;
  },
  aoDesligar: () => {
    if(Sala.ativa()) Sala.fechar();
    $("#btnComecar").textContent = "Começar";
    $("#btnComecar").disabled = false;
  }
});

$("#btnComecar").addEventListener("click", comecar);
$("#btnSair").addEventListener("click", () => UI.trocarTela("telaPreparo"));
$("#btnDeNovo").addEventListener("click", comecar);
$("#btnVoltarPreparo").addEventListener("click", () => UI.trocarTela("telaPreparo"));

montarPreparo();
</script>
