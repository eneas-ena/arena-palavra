<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<title>Dominó — Arena da Palavra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena da Palavra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
.faixa{display:flex;align-items:stretch;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.faixa .lado{
  flex:1;min-width:76px;text-align:center;padding:8px 5px;border-radius:9px;
  background:var(--surface);border:1px solid var(--linha);
  transition:border-color .2s, background .2s;
}
.faixa .lado.vez{border-color:var(--cor-lado);background:color-mix(in srgb, var(--cor-lado) 15%, var(--surface))}
.faixa .lado .quem{
  display:block;font-family:'Cinzel',serif;font-size:12px;color:var(--ink-dim);
  margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.faixa .lado.vez .quem{color:var(--cor-lado)}
.faixa .lado .pontos{font-size:20px;line-height:1.1;font-family:'Cinzel',serif;color:var(--cor-lado);font-variant-numeric:tabular-nums}
.faixa .lado .mao{display:block;font-size:13px;color:var(--ink-dim)}

/* ---------- peças ---------- */
.peca{
  display:grid;background:var(--casa);border:1px solid var(--casa-borda);
  border-radius:5px;overflow:hidden;padding:0;flex-shrink:0;
}
.peca .meia{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%;gap:4%}
.peca .meia i{border-radius:50%;background:#2B2417;width:100%;aspect-ratio:1;visibility:hidden;align-self:center;justify-self:center}
.peca .meia i.on{visibility:visible}
.peca .divisa{background:var(--casa-borda)}

.peca.pe{grid-template-rows:1fr 2px 1fr;width:42px;height:86px}
.peca.pe .divisa{height:2px}
.peca.deitada{grid-template-columns:1fr 2px 1fr;width:56px;height:28px}
.peca.deitada .divisa{width:2px}

.mao{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 10px;min-height:88px}
.peca.jogavel{cursor:pointer;box-shadow:0 0 0 2px var(--gold)}
.peca.jogavel:hover{box-shadow:0 0 0 3px var(--gold), 0 0 10px var(--gold)}
.peca.escolhida{box-shadow:0 0 0 3px var(--ink)}
.peca.morta{opacity:.4}

/* ---------- mesa ---------- */
.pontas{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-bottom:8px;font-family:'Cinzel',serif;
}
.ponta{
  min-width:70px;padding:8px 12px;border-radius:9px;text-align:center;
  background:var(--surface);border:1px solid var(--linha);
}
.ponta small{display:block;font-size:11px;color:var(--ink-dim);font-family:'Cormorant Garamond',serif}
.ponta b{font-size:23px;color:var(--gold)}

/* Mesa como a de verdade: a fila corre na horizontal, as carroças entram
   atravessadas e, ao chegar na borda, a fila desce e volta pelo outro lado.
   As peças são posicionadas por conta, então o container é relativo. */
.mesa{
  position:relative;
  background:var(--surface);border:1px solid var(--linha);
  border-radius:10px;padding:9px;min-height:66px;
  display:grid;place-items:center;
}
.mesa .fila{position:relative;width:100%}
.mesa .peca{position:absolute;margin:0}
.mesa .vazia{color:var(--ink-dim);font-size:15px}
.mesa .peca.extremo{box-shadow:0 0 0 2px var(--gold)}

/* A escolha da ponta fica junto da mão, onde o dedo já está. */
.escolha-ponta{
  display:none;margin:0 0 10px;padding:12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--gold);text-align:center;
}
.escolha-ponta.aparece{display:block}
.escolha-ponta p{margin:0 0 10px;font-size:17px}
.escolha-ponta .duas{display:flex;gap:9px}
.escolha-ponta .duas button{
  flex:1;padding:15px 8px;border-radius:9px;
  background:var(--gold);color:#0A1425;
  font-family:'Cinzel',serif;font-size:16px;font-weight:600;
}
.escolha-ponta .duas button:active{opacity:.8}
.escolha-ponta .cancelar{
  display:block;width:100%;margin-top:9px;padding:10px;
  color:var(--ink-dim);font-size:15px;border-radius:8px;border:1px solid var(--linha);
}

.botoes{display:flex;gap:8px;margin-bottom:10px}
.botoes button{flex:1;padding:12px 8px;font-size:15px}

/* Quando nenhuma peça serve, a única saída é comprar ou passar — e o
   botão precisa saltar aos olhos. Antes ele tinha exatamente a mesma
   cara de um botão desligado, e a instrução ficava numa linha cinza
   embaixo, onde o olho não vai. */
.botoes button.precisa{
  background:var(--gold);border-color:var(--gold);color:#1A1408;
  font-weight:600;opacity:1;
  animation:chama 1.6s ease-in-out infinite;
}
@keyframes chama{
  0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,.55)}
  50%{box-shadow:0 0 0 6px rgba(201,162,39,0)}
}
@media (prefers-reduced-motion:reduce){.botoes button.precisa{animation:none}}

/* ---------- passagem do aparelho ---------- */
.passagem{
  position:fixed;inset:0;background:var(--bg);z-index:50;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:14px;
}
.passagem.ativa{display:flex}
.passagem h2{font-size:22px;margin:0;color:var(--gold)}
.passagem p{color:var(--ink-dim);font-size:17px;margin:0;max-width:30ch}
.passagem .principal{max-width:280px}

.desfecho{text-align:center;margin-top:12px}
.desfecho .frase{font-family:'Cinzel',serif;font-size:19px;margin:0 0 8px}
.desfecho .frase.venceu{color:var(--gold)}
.desfecho .conta{font-size:16px;color:var(--ink-dim);margin:0 0 12px}
</style>
</head>
<body>

<header></header>

<main>

<!-- ============ PREPARO ============ -->
<section class="tela ativa" id="telaPreparo">
  <div class="bloco">
    <h2>Quantos jogam</h2>
    <div class="escolhas" id="escQtd"></div>
    <p class="legenda" style="margin:14px 0 0" id="legQtd">—</p>
  </div>

  <div class="bloco">
    <h2>Pedras para cada um</h2>
    <div class="escolhas" id="escPecas"></div>
  </div>

  <div class="bloco">
    <h2>O que sobra</h2>
    <div class="escolhas" id="escDorme"></div>
    <p class="legenda" style="margin:14px 0 0" id="legDorme">—</p>
  </div>

  <div class="bloco">
    <h2>A partida vai até</h2>
    <div class="escolhas" id="escAlvo"></div>
  </div>

  <div class="bloco">
    <h2>Os jogadores</h2>
    <div id="listaJogadores"></div>
  </div>

  <div class="bloco">

    <label class="opcao">
      <input type="checkbox" id="optBatida" checked>
      <span>Pergunta na batida
        <small>Para jogar a última peça e bater, é preciso acertar uma pergunta bíblica. Errando, a peça não sai e a vez passa.</small>
      </span>
    </label>
  </div>

  <div id="painelSala"></div>

  <button class="principal" id="btnComecar">Começar</button>
</section>

<!-- ============ JOGO ============ -->
<section class="tela" id="telaJogo">
  <div class="faixa" id="faixa"></div>

  <div class="pontas" id="pontas"></div>
  <div class="mesa" id="mesa"></div>

  <div class="escolha-ponta" id="escolhaPonta">
    <p id="escolhaTexto">—</p>
    <div class="duas">
      <button id="btnPontaL">—</button>
      <button id="btnPontaR">—</button>
    </div>
    <button class="cancelar" id="btnCancelar">Escolher outra peça</button>
  </div>

  <div class="mao" id="minhaMao"></div>

  <div class="botoes" id="botoes">
    <button class="secundario menor" id="btnComprar">Comprar do dorme</button>
    <button class="secundario menor" id="btnPassar">Passar a vez</button>
  </div>

  <p class="aviso" id="aviso">—</p>
  <div class="desfecho" id="desfecho"></div>
  <button class="secundario" id="btnSair">Encerrar e voltar</button>
</section>

<!-- ============ FIM ============ -->
<section class="tela" id="telaFim">
  <div class="fim">
    <h2 id="fimTitulo">—</h2>
    <p class="legenda" id="fimSub">—</p>
    <ol class="placar-lista" id="placarFinal"></ol>
    <button class="principal" id="btnDeNovo">Jogar de novo</button>
    <button class="secundario" id="btnVoltarPreparo">Mudar as opções</button>
  </div>
</section>

</main>

<div class="passagem" id="passagem">
  <h2 id="passagemNome">—</h2>
  <p id="passagemTexto">Passe o aparelho e toque quando estiver com ele na mão.</p>
  <button class="principal" id="btnVerMao">Ver minhas peças</button>
</div>

<script src="perguntas.js"></script>
<script src="comum.js"></script>
<script src="sala.js"></script>
<script>
"use strict";

/* =========================================================
   DOMINÓ — Arena da Palavra
   Dominó de seis, 28 peças. Para bater é preciso acertar
   uma pergunta bíblica: a última peça é a mais cara da mão.
   v1.0.0
   ========================================================= */

const VERSAO = "2.4.1";
const CORES_JOGADOR = ["#D4565F", "#C9A227", "#2A5B9C", "#2E6B4F"];
const PIPS = {0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

/* Contagem por tipo de batida, como se joga na Paraíba:
     simples 1 · carroça 2 · lá-e-lô 2 · cruzada 4
   Mesa trancada vale 1 ponto para quem tiver menos pontos na mão. */
const BATIDAS = {
  simples: {nome:"Batida simples",  pontos:1},
  carroca: {nome:"Batida de carroça", pontos:2},
  laelo:   {nome:"Batida de lá-e-lô", pontos:2},
  cruzada: {nome:"Batida de cruzada", pontos:4},
  trancou: {nome:"Mesa trancada",     pontos:1}
};

function tipoDaBatida(pc, pontas){
  const dupla = pc[0] === pc[1];
  const serveEsq = pc[0] === pontas[0] || pc[1] === pontas[0];
  const serveDir = pc[0] === pontas[1] || pc[1] === pontas[1];
  const nasDuas = serveEsq && serveDir;
  if(dupla && nasDuas && pontas[0] === pontas[1]) return "cruzada";
  if(dupla) return "carroca";
  if(nasDuas && pontas[0] !== pontas[1]) return "laelo";
  return "simples";
}

const REGRAS = `
  <h2>Como se joga</h2>

  <h3>As peças</h3>
  <p>São 28 peças, de zero-zero até seis-seis. Cada jogador recebe seis ou sete, conforme o combinado no preparo.</p>

  <h3>O que sobra: dorme ou pedras dormindo</h3>
  <p>As pedras que não foram distribuídas podem ter dois destinos, e isso muda o jogo por completo.</p>
  <p><b>Pode comprar:</b> quem não tem jogada vai comprando até achar uma pedra que sirva. É o dominó de mesa de bar.</p>
  <p><b>Fica dormindo:</b> aquelas pedras saem do jogo e ninguém toca nelas. Quem não tem jogada simplesmente passa. É a forma mais comum entre quatro jogadores, com seis pedras para cada um e quatro dormindo — e existe justamente para atrapalhar quem conta as pedras, porque nunca se sabe ao certo o que está na mão de quem.</p>

  <h3>Quem começa</h3>
  <p>Começa quem tiver a carroça mais alta — o seis-seis, se alguém o tiver, senão o cinco-cinco, e assim por diante. Não havendo carroça, começa quem tem a peça mais pesada.</p>

  <h3>A jogada</h3>
  <p>Encaixe uma peça numa das duas pontas da mesa, casando os números. As peças que você pode jogar ficam contornadas de dourado. Se a peça servir nas duas pontas, o app pergunta em qual você quer.</p>
  <p>Não tendo peça que sirva, compre do dorme. Com o dorme vazio, passe a vez.</p>

  <h3>A batida e a pergunta</h3>
  <p>Quem joga a última peça bate e ganha a mão. Mas, com a regra da casa ligada, essa última peça só sai se você acertar uma pergunta bíblica. Errando, ela fica na sua mão e a vez passa — e o adversário pode bater antes de você.</p>
  <p>É a regra mais dura da Arena, e dá para desligá-la no preparo.</p>

  <h3>Quando a mesa tranca</h3>
  <p>Se ninguém puder jogar e o dorme estiver vazio, a mesa trancou. Ganha a mão quem tiver menos pontos na mão.</p>

  <h3>A contagem</h3>
  <p>Não se contam os pontos das pedras: conta-se o tipo da batida.</p>
  <ul>
    <li><b>Simples</b> — 1 ponto.</li>
    <li><b>Carroça</b> — a última pedra é uma dupla: 2 pontos.</li>
    <li><b>Lá-e-lô</b> — a última pedra servia nas duas pontas, que tinham números diferentes: 2 pontos.</li>
    <li><b>Cruzada</b> — a última pedra é uma dupla e as duas pontas eram do número dela: 4 pontos.</li>
    <li><b>Mesa trancada</b> — 1 ponto para quem tiver menos pontos somados na mão.</li>
  </ul>

  <h3>Mão impugnada</h3>
  <p>Se alguém receber cinco ou mais carroças nas sete pedras, a mão não vale: as pedras voltam, embaralham e distribui-se de novo.</p>
`;

let cfg = { qtd:2, pecas:7, comprar:true, alvo:6, batida:true, jogadores:[] };
let jogo = null;

/* ---------------------------------------------------------
   PREPARO
   --------------------------------------------------------- */

function montarPreparo(){
  UI.escolhas($("#escQtd"), [2,3,4], cfg.qtd, v => { cfg.qtd = v; montarPreparo(); });
  UI.escolhas($("#escPecas"),
    [{valor:6,rotulo:"6 pedras"},{valor:7,rotulo:"7 pedras"}],
    cfg.pecas, v => { cfg.pecas = v; montarPreparo(); });
  UI.escolhas($("#escDorme"),
    [{valor:true,rotulo:"Pode comprar"},{valor:false,rotulo:"Fica dormindo"}],
    cfg.comprar, v => { cfg.comprar = v; montarPreparo(); });
  UI.escolhas($("#escAlvo"),
    [{valor:4,rotulo:"4 pontos"},{valor:6,rotulo:"6"},{valor:10,rotulo:"10"}],
    cfg.alvo, v => { cfg.alvo = v; montarPreparo(); });

  const sobram = 28 - cfg.qtd * cfg.pecas;
  $("#legQtd").textContent = cfg.qtd + " jogadores, " + cfg.pecas + " pedras cada: "
    + (cfg.qtd * cfg.pecas) + " na mesa e " + sobram + (sobram === 1 ? " de fora." : " de fora.");
  $("#legDorme").textContent = sobram === 0
    ? "Com esta distribuição não sobra pedra nenhuma: quem não tem jogada apenas passa a vez."
    : (cfg.comprar
        ? "Quem não tiver jogada compra do dorme até achar uma pedra que sirva."
        : "As " + sobram + " pedras ficam dormindo e não entram mais no jogo. Quem não tiver jogada passa a vez — e ninguém consegue contar as pedras com certeza.");

  const anteriores = cfg.jogadores;
  const lista = $("#listaJogadores");
  lista.innerHTML = "";
  cfg.jogadores = [];

  for(let i = 0; i < cfg.qtd; i++){
    const velho = anteriores[i] || {};
    const j = {
      nome: velho.nome || (i === 0 ? "Você" : "Máquina " + i),
      tipo: velho.tipo || (i === 0 ? "humano" : "maquina"),
      nivel: velho.nivel || 2,
      cor: CORES_JOGADOR[i],
      pontos: 0,
      mao: []
    };
    const linha = document.createElement("div");
    linha.className = "jogador-linha";
    const bola = document.createElement("span");
    bola.className = "bolinha"; bola.style.background = j.cor;
    const nome = document.createElement("input");
    nome.type = "text"; nome.value = j.nome; nome.maxLength = 14;
    nome.setAttribute("aria-label", "Nome do jogador " + (i+1));
    nome.addEventListener("input", () => { j.nome = nome.value.trim() || ("Jogador " + (i+1)); });
    const tipo = document.createElement("select");
    tipo.setAttribute("aria-label", "Tipo de jogador");
    [["humano","Pessoa"],["maquina","Máquina"]].forEach(([v,t]) => {
      const o = document.createElement("option"); o.value = v; o.textContent = t;
      if(v === j.tipo) o.selected = true; tipo.appendChild(o);
    });
    tipo.addEventListener("change", () => {
      j.tipo = tipo.value;
      if(j.tipo === "maquina" && !/Máquina/.test(j.nome)){ j.nome = "Máquina " + i; montarPreparo(); }
    });
    const nivel = document.createElement("select");
    nivel.setAttribute("aria-label", "Nível");
    [[1,"Fácil"],[2,"Médio"],[3,"Difícil"]].forEach(([v,t]) => {
      const o = document.createElement("option"); o.value = v; o.textContent = t;
      if(v === j.nivel) o.selected = true; nivel.appendChild(o);
    });
    nivel.addEventListener("change", () => { j.nivel = Number(nivel.value); });
    linha.append(bola, nome, tipo, nivel);
    lista.appendChild(linha);
    cfg.jogadores.push(j);
  }
}

/* ---------------------------------------------------------
   PEÇAS
   --------------------------------------------------------- */

function baralho(){
  const p = [];
  for(let a = 0; a <= 6; a++) for(let b = a; b <= 6; b++) p.push([a,b]);
  return p;
}
function embaralhar(a){
  for(let i = a.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [a[i], a[k]] = [a[k], a[i]];
  }
  return a;
}
const valor = pc => pc[0] + pc[1];
const carroca = pc => pc[0] === pc[1];

function desenharPeca(pc, deitada){
  const d = document.createElement("div");
  d.className = "peca " + (deitada ? "deitada" : "pe");
  const meia = v => {
    const m = document.createElement("span");
    m.className = "meia";
    for(let k = 0; k < 9; k++){
      const i = document.createElement("i");
      if(PIPS[v].includes(k)) i.className = "on";
      m.appendChild(i);
    }
    return m;
  };
  const divisa = document.createElement("span");
  divisa.className = "divisa";
  d.append(meia(pc[0]), divisa, meia(pc[1]));
  d.setAttribute("aria-label", pc[0] + " e " + pc[1]);
  return d;
}

/* ---------------------------------------------------------
   PARTIDA
   --------------------------------------------------------- */

function comecar(){
  cfg.batida = $("#optBatida").checked;
  if(28 - cfg.qtd * cfg.pecas === 0) cfg.comprar = false;
  Banco.zerar();
  cfg.jogadores.forEach(j => j.pontos = 0);
  jogo = { mao:1 };
  UI.trocarTela("telaJogo");
  novaMao();
}

function novaMao(){
  let pecas, impugnadas = 0;
  do {
    pecas = embaralhar(baralho());
    cfg.jogadores.forEach((j, i) => { j.mao = pecas.slice(i*cfg.pecas, i*cfg.pecas + cfg.pecas); });
    var impugnada = cfg.jogadores.some(j => j.mao.filter(carroca).length >= 5);
    if(impugnada) impugnadas++;
  } while(impugnada && impugnadas < 50);
  jogo.impugnadas = impugnadas;
  jogo.dorme = pecas.slice(cfg.qtd * cfg.pecas);
  jogo.mesa = [];              // peças na ordem em que estão na mesa
  jogo.pontas = [null, null];
  jogo.fase = "jogar";
  jogo.escolhida = null;
  jogo.passesSeguidos = 0;

  // começa quem tem a carroça mais alta; sem carroça, a peça mais pesada
  let melhor = -1, quem = 0;
  cfg.jogadores.forEach((j, i) => {
    j.mao.forEach(pc => {
      const nota = (carroca(pc) ? 100 : 0) + valor(pc);
      if(nota > melhor){ melhor = nota; quem = i; }
    });
  });
  jogo.vez = quem;
  jogo.dormeQtd = jogo.dorme.length;

  if(online()){
    // só a mão do outro vai para o outro; a minha nunca sai daqui
    recado({tipo:"maos", mao: cfg.jogadores[1].mao, qtdDele: cfg.jogadores[0].mao.length,
            dorme: jogo.dorme.length, comeca: quem, rodada: jogo.mao,
            alvo: cfg.alvo, batida: cfg.batida, pecas: cfg.pecas, comprar: cfg.comprar,
            pontos: cfg.jogadores.map(j => j.pontos),
            nomes: cfg.jogadores.map(j => j.nome)});
    /* Depois de mandar, o dono esquece a mão do outro. Ele precisou
       conhecê-la por um instante para distribuir; guardá-la seria
       deixar aberta a porta que este jogo inteiro serve para fechar. */
    cfg.jogadores[1].mao = Array(cfg.jogadores[1].mao.length).fill(null);
  }

  jogo.ultimoJogador = null;
  $("#desfecho").innerHTML = "";
  jogo.fase = "jogar";
  redesenhar();
  avisar((jogo.impugnadas
      ? (jogo.impugnadas === 1 ? "Uma mão foi impugnada por cinco carroças. " : jogo.impugnadas + " mãos foram impugnadas. ")
      : "")
    + cfg.jogadores[quem].nome + " começa, com a peça mais alta.");
  setTimeout(seguirVez, 900);
}

function atual(){ return cfg.jogadores[jogo.vez]; }

function encaixa(pc, ponta){ return pc[0] === ponta || pc[1] === ponta; }

function jogaveis(mao){
  if(jogo.mesa.length === 0) return mao.map((pc, i) => ({i, pontas:["l","r"]}));
  const fora = [];
  mao.forEach((pc, i) => {
    const pontas = [];
    if(encaixa(pc, jogo.pontas[0])) pontas.push("l");
    if(encaixa(pc, jogo.pontas[1])) pontas.push("r");
    if(pontas.length) fora.push({i, pontas});
  });
  return fora;
}

function redesenhar(){
  montarFaixa();
  desenharMesa();
  desenharMao();
}

function montarFaixa(){
  const f = $("#faixa");
  f.innerHTML = "";
  cfg.jogadores.forEach((j, i) => {
    const d = document.createElement("div");
    d.className = "lado" + (i === jogo.vez && jogo.fase !== "fim" ? " vez" : "");
    d.style.setProperty("--cor-lado", j.cor);
    d.innerHTML = '<span class="quem"></span><span class="pontos"></span><span class="mao"></span>';
    $(".quem", d).textContent = j.nome;
    $(".pontos", d).textContent = j.pontos;
    $(".mao", d).textContent = j.mao.length + (j.mao.length === 1 ? " peça" : " peças");
    f.appendChild(d);
  });
}

function desenharMesa(){
  const m = $("#mesa");
  m.innerHTML = "";

  if(jogo.mesa.length === 0){
    const v = document.createElement("span");
    v.className = "vazia";
    v.textContent = "a mesa está vazia";
    m.appendChild(v);
    return desenharPontas();
  }

  const fila = document.createElement("div");
  fila.className = "fila";
  m.appendChild(fila);

  /* Geometria da fila, em quadradinhos de lado U:
       - peça comum deita ao longo do caminho  -> 2U por 1U
       - carroça entra atravessada             -> 1U por 2U
       - a peça que dobra a esquina vira em pé e desce para a linha seguinte
     A distância entre linhas é 3U, que é exatamente o quanto a peça da
     esquina ocupa para baixo: ela começa no meio de uma linha e termina
     no topo da outra. */
  const larg = (fila.clientWidth || 320);
  const U = Math.max(13, Math.min(28, Math.floor(larg / 11)));
  const colunas = Math.max(5, Math.floor(larg / U));
  /* Distância entre linhas = 2U, que é o comprimento de uma peça.
     A peça da esquina começa na linha de cima e termina exatamente
     na linha de baixo, fechando o "L" sem folga nem sobreposição. */
  const passo = 2 * U;

  /* Percurso em colunas absolutas, para a peça da esquina nunca cair
     em cima da anterior: cada peça sabe em qual coluna começa e quantas
     ocupa, e o caminho anda para a direita ou para a esquerda. */
  const postas = [];
  let coluna = 0, sentido = 1, banda = 0;

  jogo.mesa.forEach((pc, k) => {
    const carro = pc[0] === pc[1];
    const largura = carro ? 1 : 2;
    /* Guarda sempre uma coluna livre no fim da linha: é onde a peça da
       esquina vai ficar. Sem essa reserva, quando a linha fecha exatamente
       na borda, a esquina é empurrada para cima da peça anterior. */
    const cabe = sentido === 1 ? (coluna + largura <= colunas - 1)
                               : (coluna - largura >= 1);

    if(!cabe){
      // esta peça dobra a esquina: fica em pé e desce para a linha seguinte
      let cx = sentido === 1 ? coluna : coluna - 1;
      cx = Math.max(0, Math.min(cx, colunas - 1));
      postas.push({pc, k, banda, esquina:true, cx, largura:1});
      banda++;
      sentido = -sentido;
      // a linha seguinte encosta na esquina pelo lado, formando o "L":
      // ela não pode ocupar a mesma coluna da peça que desceu
      coluna = sentido === 1 ? cx + 1 : cx;
      return;
    }

    const cx = sentido === 1 ? coluna : coluna - largura;
    postas.push({pc, k, banda, esquina:false, carro, cx, largura,
                 invertida: sentido === -1});
    coluna += sentido * largura;
  });

  let maisBaixo = 0;

  postas.forEach(p => {
    let pc = p.pc, emPe, larguraPx, alturaPx, topo;

    if(p.esquina){
      emPe = true;                       // na esquina o caminho é para baixo
      larguraPx = U; alturaPx = 2 * U;
      topo = p.banda * passo + U;        // desce da linha de cima até a linha de baixo
    } else {
      emPe = p.carro;                    // carroça atravessada, comum deitada
      larguraPx = p.carro ? U : 2 * U;
      alturaPx  = p.carro ? 2 * U : U;
      topo = p.banda * passo + (p.carro ? 0 : 0.5 * U);
      if(p.invertida) pc = [p.pc[1], p.pc[0]];
    }

    const d = desenharPeca(pc, !emPe);
    d.style.width  = larguraPx + "px";
    d.style.height = alturaPx + "px";
    d.style.left   = (p.cx * U) + "px";
    d.style.top    = topo + "px";
    if(p.k === 0 || p.k === jogo.mesa.length - 1) d.classList.add("extremo");
    fila.appendChild(d);
    maisBaixo = Math.max(maisBaixo, topo + alturaPx);
  });

  fila.style.height = Math.ceil(maisBaixo) + "px";

  desenharPontas();
}

function desenharPontas(){
  const p = $("#pontas");
  p.innerHTML = "";
  if(jogo.mesa.length === 0){
    p.innerHTML = '<span class="ponta"><small>mesa vazia</small><b>—</b></span>';
    return;
  }
  [[0, "uma ponta"], [1, "a outra"]].forEach(([idx, rotulo]) => {
    const b = document.createElement("span");
    b.className = "ponta";
    b.innerHTML = '<small>' + rotulo + '</small><b>' + jogo.pontas[idx] + '</b>';
    p.appendChild(b);
  });
}

function desenharMao(){
  if(jogo.escolhida === null) fecharEscolhaDePonta();
  const cx = $("#minhaMao");
  cx.innerHTML = "";
  const j = online() ? cfg.jogadores[meuIndice()] : atual();

  /* Numa sala, a mão é sua e fica sempre à vista — só deixa de aceitar
     toque quando não é a sua vez. Esconder as peças faz sentido apenas
     no revezamento em um aparelho só, onde a tela é de todos. */
  const minhaSempre = online();
  const podeTocar = minhaSempre ? souDaVez() && jogo.fase === "jogar"
                                : j.tipo === "humano" && jogo.fase === "jogar";

  if(!minhaSempre && !podeTocar){
    const aviso = document.createElement("p");
    aviso.className = "legenda";
    aviso.style.margin = "auto";
    aviso.textContent = j.tipo === "maquina" ? j.nome + " está jogando…" : "";
    cx.appendChild(aviso);
    $("#botoes").style.display = "none";
    return;
  }

  const podem = podeTocar ? jogaveis(j.mao) : [];
  j.mao.forEach((pc, i) => {
    const d = desenharPeca(pc, false);
    const jog = podem.find(x => x.i === i);
    if(jog){
      d.classList.add("jogavel");
      if(jogo.escolhida && jogo.escolhida.i === i) d.classList.add("escolhida");
      d.setAttribute("role", "button");
      d.setAttribute("tabindex", "0");
      const agir = () => escolherPeca(jog);
      d.addEventListener("click", agir);
      d.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); agir(); }
      });
    } else d.classList.add("morta");
    cx.appendChild(d);
  });

  $("#botoes").style.display = podeTocar ? "flex" : "none";
  const noDorme = online() ? (jogo.dormeQtd || 0) : jogo.dorme.length;
  $("#btnComprar").style.display = cfg.comprar ? "" : "none";
  $("#btnComprar").disabled = podem.length > 0 || noDorme === 0;
  // só se passa quando não há jogada e também não há de onde comprar
  $("#btnPassar").disabled = podem.length > 0 || (cfg.comprar && noDorme > 0);

  // sem jogada possível, destaca o botão que é a única saída
  const semJogada = podeTocar && podem.length === 0;
  $("#btnComprar").classList.toggle("precisa", semJogada && !$("#btnComprar").disabled);
  $("#btnPassar").classList.toggle("precisa", semJogada && !$("#btnPassar").disabled);
}

function avisar(t){ $("#aviso").textContent = t || ""; }

/* ---------- vez ---------- */

function seguirVez(){
  if(jogo.fase === "fim" || jogo.fase === "fim-mao") return;
  jogo.fase = "jogar";
  jogo.escolhida = null;
  const j = atual();

  if(online()){
    redesenhar();
    if(!souDaVez()){
      $("#botoes").style.display = "none";
      return avisar("Aguardando " + j.nome + " no outro aparelho…");
    }
    return mostrarVez();
  }

  if(j.tipo === "maquina"){
    redesenhar();
    avisar(j.nome + " está jogando…");
    return setTimeout(jogadaDaMaquina, 800);
  }

  // com mais de uma pessoa, esconde a mão até o aparelho trocar de mãos
  const humanos = cfg.jogadores.filter(x => x.tipo === "humano").length;
  if(humanos > 1){
    /* Apaga a mão da tela ANTES de mostrar a cobertura. A cobertura é
       opaca, mas num jogo de mão escondida não quero depender disso. */
    jogo.fase = "passando";
    redesenhar();
    $("#minhaMao").innerHTML = "";
    $("#passagemNome").textContent = j.nome;
    $("#passagem").classList.add("ativa");
    $("#btnVerMao").focus();
    return;
  }
  mostrarVez();
}

function mostrarVez(){
  jogo.fase = "jogar";
  const j = atual();
  redesenhar();
  const podem = jogaveis(j.mao);
  const noDorme = online() ? (jogo.dormeQtd || 0) : jogo.dorme.length;
  avisar(podem.length
    ? j.nome + ", escolha uma peça."
    : (cfg.comprar && noDorme
        ? "Nenhuma peça sua serve nas pontas. Toque em “Comprar do dorme”."
        : "Nenhuma peça sua serve e não há de onde comprar. Toque em “Passar a vez”."));
}

function escolherPeca(jog){
  if(jogo.fase !== "jogar") return;
  Som.toque();
  if(jogo.mesa.length === 0) return encaixar(jog.i, "r");
  if(jog.pontas.length === 1) return encaixar(jog.i, jog.pontas[0]);
  jogo.escolhida = jog;
  redesenhar();
  abrirEscolhaDePonta(jog);
}

function abrirEscolhaDePonta(jog){
  const pc = atual().mao[jog.i];
  $("#escolhaTexto").textContent = "A peça " + pc[0] + "-" + pc[1] + " serve nas duas pontas. Onde encaixar?";
  $("#btnPontaL").textContent = "Na ponta " + jogo.pontas[0];
  $("#btnPontaR").textContent = "Na ponta " + jogo.pontas[1];
  $("#escolhaPonta").classList.add("aparece");
  $("#btnPontaL").focus();
  avisar("");
}

function fecharEscolhaDePonta(){
  $("#escolhaPonta").classList.remove("aparece");
}

function encaixar(indice, lado){
  /* Trava a mesa antes de qualquer coisa. Sem isso, os botões das pontas
     continuam clicáveis enquanto a pergunta da batida está aberta, e a
     mesma peça pode ser jogada duas vezes. */
  if(jogo.fase !== "jogar") return;
  const j = atual();
  const pc = j.mao[indice];
  if(!pc) return;
  const ultima = j.mao.length === 1;

  jogo.fase = "movendo";
  jogo.escolhida = null;
  fecharEscolhaDePonta();
  redesenhar();

  if(ultima && cfg.batida && j.tipo === "humano"){
    jogo.fase = "respondendo";
    return Pergunta.abrir({
      para: j.nome,
      nivel: j.nivel,
      texto: a => a ? "Certa. A peça sai e você bate." : "Errada. A peça fica na sua mão e a vez passa.",
      aoResponder: (acertou) => {
        if(!acertou){
          Som.erro();
          avisar("A batida falhou. A peça continua com você.");
          jogo.fase = "jogar";
          if(online()){
            // a vez muda aqui: sem avisar, os dois ficam se esperando
            recado({tipo:"vezPassa"});
            jogo.vez = 1 - meuIndice();
            return depois(seguirVez);
          }
          return setTimeout(passarAdiante, 900);
        }
        assentar(indice, lado);
      }
    });
  }

  if(ultima && cfg.batida && j.tipo === "maquina"){
    jogo.fase = "respondendo";
    const acertou = Math.random() < ACERTO_MAQUINA[j.nivel];
    return setTimeout(() => {
      if(!acertou){
        Som.erro();
        avisar(j.nome + " ia bater mas errou a pergunta.");
        jogo.fase = "jogar";
        return setTimeout(passarAdiante, 1000);
      }
      Som.acerto();
      assentar(indice, lado);
    }, 800);
  }

  assentar(indice, lado);
}

/* Põe uma peça na mesa. Serve tanto para a minha jogada quanto para a
   que chega do outro aparelho — por isso recebe a peça, e não o índice. */
function assentarPeca(pc, lado, dono){
  if(jogo.mesa.length === 0){
    jogo.mesa.push(pc.slice());
    jogo.pontas = [pc[0], pc[1]];
  } else if(lado === "l"){
    const p = jogo.pontas[0];
    const posta = pc[1] === p ? [pc[0], pc[1]] : [pc[1], pc[0]];
    jogo.mesa.unshift(posta);
    jogo.pontas[0] = posta[0];
  } else {
    const p = jogo.pontas[1];
    const posta = pc[0] === p ? [pc[0], pc[1]] : [pc[1], pc[0]];
    jogo.mesa.push(posta);
    jogo.pontas[1] = posta[1];
  }
  Som.marcar();
}

function assentar(indice, lado){
  const j = atual();
  if(!j.mao[indice]) return;

  // o tipo da batida depende das pontas ANTES desta jogada
  const tipo = (j.mao.length === 1 && jogo.mesa.length)
    ? tipoDaBatida(j.mao[indice], jogo.pontas) : null;

  const pc = j.mao.splice(indice, 1)[0];
  jogo.escolhida = null;
  jogo.passesSeguidos = 0;
  assentarPeca(pc, lado, jogo.vez);

  if(online()){
    recado({tipo:"joga", pc, lado, restam: j.mao.length});
    if(j.mao.length === 0){
      const pontos = BATIDAS[tipo || "simples"].pontos;
      recado({tipo:"bateu", batida: tipo || "simples", pontos});
      redesenhar();
      return setTimeout(() => fecharMaoOnline(meuIndice(), tipo || "simples", pontos), 700);
    }
    jogo.fase = "jogar";
    jogo.vez = 1 - meuIndice();
    redesenhar();
    avisar("Você jogou " + pc[0] + "-" + pc[1] + ".");
    return depois(seguirVez);
  }

  jogo.fase = "jogar";
  redesenhar();
  avisar(j.nome + " jogou " + pc[0] + "-" + pc[1] + ".");

  jogo.ultimoJogador = jogo.vez;
  if(j.mao.length === 0)
    return setTimeout(() => fimDaMao(jogo.vez, tipo || "simples"), 900);
  setTimeout(passarAdiante, 750);
}

function comprar(){
  if(jogo.fase !== "jogar" || !cfg.comprar) return;
  if(online()){
    if(!souDaVez()) return;
    if((jogo.dormeQtd || 0) === 0) return;
    if(souODono()){
      const pc = jogo.dorme.pop();
      jogo.dormeQtd = jogo.dorme.length;
      cfg.jogadores[meuIndice()].mao.push(pc);
      recado({tipo:"dorme", n: jogo.dorme.length});
      Som.toque(); redesenhar();
      return avisar("Você comprou " + pc[0] + "-" + pc[1] + ". Restam " + jogo.dormeQtd + " no dorme.");
    }
    recado({tipo:"compra"});
    return avisar("Pedindo uma peça do dorme…");
  }
  if(jogo.dorme.length === 0) return;
  const j = atual();
  j.mao.push(jogo.dorme.pop());
  Som.toque();
  redesenhar();
  avisar(j.nome + " comprou uma peça. Restam " + jogo.dorme.length + " no dorme.");
}

function passar(){
  if(jogo.fase !== "jogar") return;
  if(online() && !souDaVez()) return;
  jogo.fase = "movendo";
  jogo.passesSeguidos++;
  Som.pausa();

  if(online()){
    avisar("Você passou a vez.");
    recado({tipo:"passa"});
    if(jogo.passesSeguidos >= 2){
      const soma = cfg.jogadores[meuIndice()].mao.reduce((s, p) => s + valor(p), 0);
      recado({tipo:"soma", valor:soma, de:meuIndice()});
      if(souODono()) guardarSoma(meuIndice(), soma);
      return;
    }
    jogo.vez = 1 - meuIndice();
    return depois(seguirVez);
  }

  avisar(atual().nome + " passou a vez.");
  if(jogo.passesSeguidos >= cfg.qtd) return setTimeout(() => fimDaMao(null, null), 800);
  setTimeout(passarAdiante, 700);
}

function passarAdiante(){
  if(jogo.fase === "fim") return;
  jogo.vez = (jogo.vez + 1) % cfg.qtd;
  seguirVez();
}

/* ---------------------------------------------------------
   A MÁQUINA
   --------------------------------------------------------- */

function jogadaDaMaquina(){
  const j = atual();
  let podem = jogaveis(j.mao);

  while(podem.length === 0 && cfg.comprar && jogo.dorme.length > 0){
    j.mao.push(jogo.dorme.pop());
    podem = jogaveis(j.mao);
  }
  if(podem.length === 0){
    redesenhar();
    return passar();
  }

  let escolha;
  if(j.nivel === 1){
    escolha = podem[Math.floor(Math.random() * podem.length)];
  } else {
    // pesa: soltar peça pesada, guardar variedade de números, segurar carroça útil
    const contaNumeros = {};
    j.mao.forEach(pc => { contaNumeros[pc[0]] = (contaNumeros[pc[0]]||0)+1;
                          contaNumeros[pc[1]] = (contaNumeros[pc[1]]||0)+1; });
    let melhorNota = -Infinity;
    podem.forEach(x => {
      const pc = j.mao[x.i];
      x.pontas.forEach(lado => {
        let nota = valor(pc) * 1.2;
        if(carroca(pc)) nota += 6;
        // que número fica exposto depois desta jogada?
        const exposto = jogo.mesa.length === 0 ? pc[0]
          : (lado === "l" ? (pc[1] === jogo.pontas[0] ? pc[0] : pc[1])
                          : (pc[0] === jogo.pontas[1] ? pc[1] : pc[0]));
        nota += (contaNumeros[exposto] || 0) * 3;          // deixa aberto o que eu tenho
        if(j.nivel === 3){
          const outros = cfg.jogadores.filter(o => o !== j)
                          .reduce((s,o) => s + o.mao.length, 0);
          if(j.mao.length <= 3) nota += valor(pc) * 0.8;    // no fim, descarrega peso
          if(outros <= 3) nota += (contaNumeros[exposto]||0) * 2;
        }
        if(nota > melhorNota){ melhorNota = nota; escolha = {i:x.i, lado}; }
      });
    });
  }

  const lado = escolha.lado || (escolha.pontas ? escolha.pontas[0] : "r");
  redesenhar();
  setTimeout(() => encaixar(escolha.i, lado), 400);
}

/* ---------------------------------------------------------
   FIM DE MÃO E DE PARTIDA
   --------------------------------------------------------- */

function fimDaMao(vencedor, tipo){
  jogo.fase = "fim-mao";

  if(vencedor === null){
    // trancou: ganha quem tem menos pontos na mão; empate vai para quem jogou por último
    let menor = Infinity, empatados = [];
    cfg.jogadores.forEach((j, i) => {
      const soma = j.mao.reduce((s, pc) => s + valor(pc), 0);
      if(soma < menor){ menor = soma; empatados = [i]; }
      else if(soma === menor) empatados.push(i);
    });
    vencedor = empatados.length > 1 && empatados.includes(jogo.ultimoJogador)
      ? jogo.ultimoJogador : empatados[0];
    tipo = "trancou";
  }

  const batida = BATIDAS[tipo] || BATIDAS.simples;
  cfg.jogadores[vencedor].pontos += batida.pontos;

  Som.chegou();
  redesenhar();

  const cx = $("#desfecho");
  cx.innerHTML = "";
  const frase = document.createElement("p");
  frase.className = "frase venceu";
  frase.textContent = tipo === "trancou"
    ? "A mesa trancou. " + cfg.jogadores[vencedor].nome + " tinha menos pontos na mão."
    : cfg.jogadores[vencedor].nome + " bateu — " + batida.nome.toLowerCase() + "!";
  const conta = document.createElement("p");
  conta.className = "conta";
  conta.textContent = batida.pontos + (batida.pontos === 1 ? " ponto" : " pontos") +
    " · total " + cfg.jogadores[vencedor].pontos + " de " + cfg.alvo;
  cx.append(frase, conta);

  const acabou = cfg.jogadores[vencedor].pontos >= cfg.alvo;
  const b = document.createElement("button");
  b.className = "principal";
  b.textContent = acabou ? "Ver o resultado" : "Próxima mão";
  b.addEventListener("click", () => {
    if(acabou) return fimDaPartida();
    jogo.mao++;
    novaMao();
  });
  cx.appendChild(b);
  b.focus();
}

function fimDaPartida(){
  jogo.fase = "fim";
  Som.vitoria();
  const ordem = cfg.jogadores.slice().sort((a,b) => b.pontos - a.pontos);
  $("#fimTitulo").textContent = ordem[0].nome + " venceu";
  $("#fimSub").textContent = jogo.mao + (jogo.mao === 1 ? " mão jogada" : " mãos jogadas") +
    " · partida de " + cfg.alvo + " pontos";
  const ol = $("#placarFinal");
  ol.innerHTML = "";
  ordem.forEach(j => {
    const li = document.createElement("li");
    const bola = document.createElement("span");
    bola.className = "bolinha"; bola.style.background = j.cor;
    const nome = document.createElement("span"); nome.textContent = j.nome;
    const pts = document.createElement("span");
    pts.style.flex = "0"; pts.style.color = "var(--ink-dim)";
    pts.textContent = j.pontos;
    li.append(bola, nome, pts);
    ol.appendChild(li);
  });
  UI.trocarTela("telaFim");
}

/* ---------------------------------------------------------
   SALA — mão escondida e um dorme compartilhado

   Cada aparelho guarda a própria mão e nunca a envia. Quem abre a
   sala distribui as pedras, manda ao outro apenas a mão dele, e fica
   com o dorme: quando o outro precisa comprar, pede e recebe uma peça.

   Recados: maos, joga, compra, peca, passa, bateu, soma, trancou.
   Toda resposta do dono sai fora da trava de eco, senão morre ali.
   --------------------------------------------------------- */

function online(){ return Sala.ativa(); }
function souODono(){ return Sala.meuLugar === 0; }
function meuIndice(){ return online() ? Sala.meuLugar : jogo.vez; }
function souDaVez(){ return !online() || jogo.vez === meuIndice(); }
function recado(m){ if(online()) Sala.publicar(m); }
function depois(f){ setTimeout(f, 0); }

function receberRecado(m){
  if(!m || !m.tipo) return;

  if(m.tipo === "maos"){
    cfg.alvo = m.alvo; cfg.batida = m.batida;
    cfg.pecas = m.pecas; cfg.comprar = m.comprar; cfg.qtd = 2;
    montarPreparo();
    cfg.jogadores.forEach((j, i) => { j.tipo = "humano"; j.pontos = m.pontos[i]; });
    cfg.jogadores[0].nome = m.nomes[0]; cfg.jogadores[1].nome = m.nomes[1];
    jogo = jogo || {mao:1};
    jogo.mao = m.rodada;
    cfg.jogadores[1].mao = m.mao;                  // a minha, que sou o segundo
    cfg.jogadores[0].mao = Array(m.qtdDele).fill(null);
    jogo.dorme = [];                                // o dorme fica com o dono
    jogo.dormeQtd = m.dorme;
    jogo.mesa = []; jogo.pontas = [null, null];
    jogo.vez = m.comeca; jogo.fase = "jogar";
    jogo.escolhida = null; jogo.passesSeguidos = 0;
    UI.trocarTela("telaJogo");
    $("#desfecho").innerHTML = "";
    redesenhar();
    avisar(cfg.jogadores[m.comeca].nome + " começa, com a peça mais alta.");
    return depois(seguirVez);
  }

  if(!jogo) return;

  if(m.tipo === "joga"){
    const outro = 1 - meuIndice();
    assentarPeca(m.pc, m.lado, outro);
    cfg.jogadores[outro].mao = Array(m.restam).fill(null);
    jogo.passesSeguidos = 0;
    redesenhar();
    avisar(cfg.jogadores[outro].nome + " jogou " + m.pc[0] + "-" + m.pc[1] + ".");
    if(m.restam === 0) return;                      // o recado "bateu" vem em seguida
    jogo.vez = meuIndice(); jogo.fase = "jogar";
    return depois(seguirVez);
  }

  if(m.tipo === "compra"){                          // só o dono responde
    if(!souODono()) return;
    return depois(() => {
      const pc = jogo.dorme.pop();
      jogo.dormeQtd = jogo.dorme.length;
      const outro = 1 - meuIndice();
      cfg.jogadores[outro].mao.push(null);
      recado({tipo:"peca", pc, dorme: jogo.dorme.length});
      redesenhar();
      avisar(cfg.jogadores[outro].nome + " comprou uma peça.");
    });
  }

  if(m.tipo === "peca"){
    cfg.jogadores[meuIndice()].mao.push(m.pc);
    jogo.dormeQtd = m.dorme;
    Som.toque();
    redesenhar();
    avisar("Você comprou " + m.pc[0] + "-" + m.pc[1] + ". Restam " + m.dorme + " no dorme.");
    return;
  }

  if(m.tipo === "dorme"){ jogo.dormeQtd = m.n; redesenhar(); return; }

  if(m.tipo === "vezPassa"){
    const outro = 1 - meuIndice();
    avisar(cfg.jogadores[outro].nome + " ia bater mas errou a pergunta.");
    jogo.vez = meuIndice(); jogo.fase = "jogar";
    return depois(seguirVez);
  }

  if(m.tipo === "passa"){
    jogo.passesSeguidos++;
    const outro = 1 - meuIndice();
    avisar(cfg.jogadores[outro].nome + " passou a vez.");
    if(jogo.passesSeguidos >= 2){
      const soma = cfg.jogadores[meuIndice()].mao.reduce((s, p) => s + valor(p), 0);
      recado({tipo:"soma", valor:soma, de:meuIndice()});
      if(souODono()) guardarSoma(meuIndice(), soma);
      return;
    }
    jogo.vez = meuIndice(); jogo.fase = "jogar";
    return depois(seguirVez);
  }

  if(m.tipo === "soma"){
    if(!souODono()) return;
    return guardarSoma(m.de, m.valor);
  }

  if(m.tipo === "trancou"){
    return fecharMaoOnline(m.vencedor, "trancou", m.pontos);
  }

  if(m.tipo === "bateu"){
    const outro = 1 - meuIndice();
    return fecharMaoOnline(outro, m.batida, m.pontos);
  }

  if(m.tipo === "novaMao"){
    return receberRecado(Object.assign({}, m.maos, {tipo:"maos"}));
  }
}

let somasTrancou = {};
function guardarSoma(quem, valorSoma){
  somasTrancou[quem] = valorSoma;
  if(Object.keys(somasTrancou).length < 2) return;
  const a = somasTrancou[0], b = somasTrancou[1];
  const vencedor = a <= b ? 0 : 1;
  somasTrancou = {};
  depois(() => {
    recado({tipo:"trancou", vencedor, pontos: BATIDAS.trancou.pontos});
    fecharMaoOnline(vencedor, "trancou", BATIDAS.trancou.pontos);
  });
}

function fecharMaoOnline(vencedor, tipo, pontos){
  jogo.fase = "fim-mao";
  cfg.jogadores[vencedor].pontos += pontos;
  const batida = BATIDAS[tipo] || BATIDAS.simples;
  Som.chegou();
  redesenhar();

  const cx = $("#desfecho");
  cx.innerHTML = "";
  const frase = document.createElement("p");
  frase.className = "frase venceu";
  frase.textContent = tipo === "trancou"
    ? "A mesa trancou. " + cfg.jogadores[vencedor].nome + " tinha menos pontos na mão."
    : cfg.jogadores[vencedor].nome + " bateu — " + batida.nome.toLowerCase() + "!";
  const conta = document.createElement("p");
  conta.className = "conta";
  conta.textContent = pontos + (pontos === 1 ? " ponto" : " pontos") +
    " · total " + cfg.jogadores[vencedor].pontos + " de " + cfg.alvo;
  cx.append(frase, conta);

  if(cfg.jogadores[vencedor].pontos >= cfg.alvo) return setTimeout(fimDaPartida, 1500);

  const b = document.createElement("button");
  b.className = "principal";
  const comando = souODono();
  b.textContent = comando ? "Próxima mão" : "Aguardando a próxima mão…";
  b.disabled = !comando;
  if(comando) b.addEventListener("click", () => { jogo.mao++; novaMao(); });
  cx.appendChild(b);
  if(comando) b.focus();
}

/* ---------------------------------------------------------
   LIGAÇÕES
   --------------------------------------------------------- */

UI.iniciar({ titulo:"Dominó", versao:VERSAO, regras:REGRAS, voltar:"index.html" });

Sala.montarPainel($("#painelSala"), {
  jogoId: "domino", lugares: 2,
  retratar: () => null,               // aqui não se publica estado, só recados
  aplicar: (m) => receberRecado(m),
  aoMudarGente: (n) => { if(jogo && jogo.fase !== "fim" && n < 2) avisar("O outro aparelho saiu da sala."); },
  aoLigar: (lugar) => {
    cfg.qtd = 2;
    montarPreparo();
    cfg.jogadores.forEach((j, i) => {
      j.tipo = "humano";
      // "Você" confunde numa sala: na tela do outro apareceria
      // "aguardando Você", falando de outra pessoa
      if(/Máquina|Você/.test(j.nome)) j.nome = "Jogador " + (i + 1);
    });
    montarPreparo();
    $("#btnComecar").textContent = lugar === 0 ? "Começar (você distribui)" : "Esperando o outro aparelho começar";
    $("#btnComecar").disabled = lugar !== 0;
  },
  aoDesligar: () => {
    if(Sala.ativa()) Sala.fechar();
    $("#btnComecar").textContent = "Começar";
    $("#btnComecar").disabled = false;
  }
});

$("#btnComecar").addEventListener("click", comecar);
let reajuste = null;
window.addEventListener("resize", () => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => { if(jogo && jogo.mesa) desenharMesa(); }, 180);
});

$("#btnPontaL").addEventListener("click", () => {
  if(jogo && jogo.escolhida) encaixar(jogo.escolhida.i, "l");
});
$("#btnPontaR").addEventListener("click", () => {
  if(jogo && jogo.escolhida) encaixar(jogo.escolhida.i, "r");
});
$("#btnCancelar").addEventListener("click", () => {
  if(!jogo) return;
  jogo.escolhida = null;
  fecharEscolhaDePonta();
  redesenhar();
  avisar(atual().nome + ", escolha uma peça.");
});
$("#btnComprar").addEventListener("click", comprar);
$("#btnPassar").addEventListener("click", passar);
$("#btnVerMao").addEventListener("click", () => {
  $("#passagem").classList.remove("ativa");
  mostrarVez();
});
$("#btnSair").addEventListener("click", () => UI.trocarTela("telaPreparo"));
$("#btnDeNovo").addEventListener("click", comecar);
$("#btnVoltarPreparo").addEventListener("click", () => UI.trocarTela("telaPreparo"));

montarPreparo();
</script>
