<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Batalha Naval — Arena da Palavra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="comum.css">
<style>
/* Espaçamentos em pixels, nunca em porcentagem no sentido vertical:
   porcentagem se calcula sobre a altura do container, que só existe
   depois de medir as casas — e a última fileira acaba vazando. */

.rotulo-mar{
  display:flex;align-items:baseline;gap:8px;margin:0 0 7px;
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold);
}
.rotulo-mar small{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--ink-dim)}

.mar{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:4px;align-content:start;
  background:var(--surface);border:1px solid var(--linha);
  border-radius:10px;padding:6px;
}
.mar.meu{gap:3px;padding:5px;max-width:230px}
.casa{
  width:100%;aspect-ratio:1;border-radius:5px;padding:0;border:none;
  background:var(--surface-2);display:grid;place-items:center;
  font-size:15px;line-height:1;color:var(--ink-dim);
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.casa.aberta:hover,.casa.aberta:focus-visible{background:rgba(201,162,39,.22)}
.casa:disabled{cursor:default}
.casa.alvo{box-shadow:0 0 0 2px var(--gold)}
.casa.agua{background:var(--bg);color:var(--ink-dim);opacity:.65}
.casa.acerto{background:var(--carmim);color:#F2EDE1}
.casa.afundado{background:var(--carmim-claro);color:#0A1425}
.casa.navio{background:var(--gold);opacity:.55}
.casa.navio.atingido{background:var(--carmim);opacity:1;color:#F2EDE1}

.frotas{
  display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 4px;
}
.barco{
  display:flex;align-items:center;gap:6px;font-size:14px;
  padding:5px 9px;border-radius:7px;border:1px solid var(--linha);background:var(--surface);
}
.barco .casco{display:flex;gap:2px}
.barco .casco i{width:7px;height:12px;border-radius:2px;background:var(--gold);display:block}
.barco.afundado{opacity:.4;text-decoration:line-through}
.barco.afundado .casco i{background:var(--carmim-claro)}

.dupla{display:grid;gap:16px;margin-bottom:6px}
.linha-info{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  padding:10px 12px;border-radius:9px;background:var(--surface);
  border:1px solid var(--linha);border-left:5px solid var(--vez-cor,var(--gold));
}
.linha-info .quem{flex:1;min-width:0}
.linha-info .nome{font-family:'Cinzel',serif;font-size:15px;display:block}
.linha-info .sub{font-size:15px;color:var(--ink-dim)}
.linha-info .contagem{font-size:15px;color:var(--ink-dim);text-align:right;flex-shrink:0;line-height:1.25}

.desfecho{text-align:center;margin-top:14px}
.desfecho .frase{font-family:'Cinzel',serif;font-size:19px;margin:0 0 10px}
.desfecho .frase.venceu{color:var(--gold)}
</style>
</head>
<body>

<header></header>

<main>

<!-- ============ PREPARO ============ -->
<section class="tela ativa" id="telaPreparo">
  <div class="bloco">
    <h2>Quem joga</h2>
    <div id="listaJogadores"></div>
  </div>

  <div class="bloco">
    <h2>A frota</h2>
    <p class="legenda" style="margin:0">Mar de 7 por 7. Quatro navios de cada lado: um de quatro casas, um de três e dois de duas.</p>
  </div>

  <div id="painelSala"></div>

  <button class="principal" id="btnPosicionar">Posicionar a frota</button>
</section>

<!-- ============ POSICIONAR ============ -->
<section class="tela" id="telaPosicionar">
  <p class="legenda">Esta é a sua frota. Se não gostou da disposição, sorteie outra.</p>
  <div class="mar meu" id="marPreview" style="max-width:280px;margin:0 auto"></div>
  <div class="frotas" id="frotaPreview" style="justify-content:center"></div>
  <button class="principal" id="btnZarpar" style="margin-top:16px">Zarpar</button>
  <button class="secundario" id="btnSortear">Sortear outra disposição</button>
</section>

<!-- ============ JOGO ============ -->
<section class="tela" id="telaJogo">
  <div class="linha-info" id="linhaInfo">
    <span class="bolinha" id="infoBolinha"></span>
    <span class="quem">
      <span class="nome" id="infoNome">—</span>
      <span class="sub" id="infoSub">—</span>
    </span>
    <span class="contagem" id="infoContagem">—</span>
  </div>

  <div class="dupla">
    <div>
      <p class="rotulo-mar">MAR INIMIGO <small>toque para mirar</small></p>
      <div class="mar" id="marInimigo"></div>
      <div class="frotas" id="frotaInimiga"></div>
    </div>
    <div>
      <p class="rotulo-mar">SUA FROTA</p>
      <div class="mar meu" id="marProprio"></div>
      <div class="frotas" id="frotaPropria"></div>
    </div>
  </div>

  <p class="aviso" id="aviso">—</p>
  <div class="desfecho" id="desfecho"></div>
  <button class="secundario" id="btnSair">Encerrar e voltar</button>
</section>

<!-- ============ FIM ============ -->
<section class="tela" id="telaFim">
  <div class="fim">
    <h2 id="fimTitulo">—</h2>
    <p class="legenda" id="fimSub">—</p>
    <button class="principal" id="btnDeNovo">Jogar de novo</button>
    <button class="secundario" id="btnVoltarPreparo">Mudar as opções</button>
  </div>
</section>

</main>

<script src="perguntas.js"></script>
<script src="comum.js"></script>
<script src="sala.js"></script>
<script>
"use strict";

/* =========================================================
   BATALHA NAVAL — Arena da Palavra
   Mire numa casa, responda a pergunta, e só então o tiro sai.
   Acertou navio, atira de novo. Caiu na água, a vez passa.
   v1.0.0
   ========================================================= */

const VERSAO = "1.1.0";
const N = 7;
const NAVIOS = [
  {nome:"Porta-aviões", tam:4},
  {nome:"Cruzador",     tam:3},
  {nome:"Submarino",    tam:2},
  {nome:"Patrulha",     tam:2}
];
const CASAS_COM_NAVIO = NAVIOS.reduce((a,b) => a + b.tam, 0);

const REGRAS = `
  <h2>Como se joga</h2>

  <h3>O objetivo</h3>
  <p>Afundar os quatro navios da máquina antes que ela afunde os seus. São 11 casas com navio em cada mar de 49.</p>

  <h3>A jogada</h3>
  <p>Toque numa casa do mar inimigo para mirar. A pergunta bíblica vem depois. Acertando a pergunta, o tiro sai; errando, o tiro não acontece e a vez passa.</p>

  <h3>Tiro certeiro dá outro tiro</h3>
  <p>Se o tiro atingir um navio, você joga de novo — e responde outra pergunta. Uma sequência de acertos pode afundar um navio inteiro num único turno.</p>

  <h3>Os dois mares</h3>
  <p>Em cima fica o mar inimigo, onde você atira. Embaixo, a sua frota, onde aparecem os tiros da máquina. Ponto escuro é água; casa vermelha é navio atingido.</p>

  <h3>Os níveis</h3>
  <p>O nível muda a dificuldade das suas perguntas e o comportamento da máquina. No fácil ela atira sempre a esmo, mesmo depois de acertar. No médio e no difícil, um acerto faz ela perseguir o navio pelas casas vizinhas até afundá-lo — e ela também erra menos perguntas.</p>

  <h3>Por que aqui não tem dois no mesmo aparelho</h3>
  <p>Batalha naval depende de cada um não ver o mar do outro. Num aparelho só isso não existe. Quando a Arena passar a ligar dois celulares, este é o jogo que mais vai ganhar com isso.</p>
`;

let cfg = { nome:"Você", nivel:2 };
let jogo = null;
let previewMar = null;

const lin = p => Math.floor(p / N);
const col = p => p % N;

/* ---------------------------------------------------------
   POSICIONAR A FROTA
   --------------------------------------------------------- */

function sortearMar(){
  for(let tentativa = 0; tentativa < 200; tentativa++){
    const mar = Array(N*N).fill(null);
    let deuCerto = true;

    for(let id = 0; id < NAVIOS.length; id++){
      const tam = NAVIOS[id].tam;
      let posto = false;
      for(let t = 0; t < 400 && !posto; t++){
        const horiz = Math.random() < 0.5;
        const l = Math.floor(Math.random() * (horiz ? N : N - tam + 1));
        const c = Math.floor(Math.random() * (horiz ? N - tam + 1 : N));
        const casas = [];
        let livre = true;
        for(let k = 0; k < tam; k++){
          const p = (l + (horiz ? 0 : k)) * N + (c + (horiz ? k : 0));
          if(mar[p] !== null){ livre = false; break; }
          casas.push(p);
        }
        if(livre){ casas.forEach(p => mar[p] = id); posto = true; }
      }
      if(!posto){ deuCerto = false; break; }
    }
    if(deuCerto) return mar;
  }
  return Array(N*N).fill(null);
}

function desenharMar(container, mar, tiros, mostrarNavios, aoClicar){
  container.innerHTML = "";
  for(let p = 0; p < N*N; p++){
    const casa = document.createElement(aoClicar ? "button" : "span");
    casa.className = "casa";
    casa.dataset.p = p;
    const t = tiros ? tiros[p] : null;

    if(mostrarNavios && mar[p] !== null) casa.classList.add("navio");

    if(t === "agua"){ casa.classList.add("agua"); casa.textContent = "·"; }
    else if(t === "acerto"){
      // no mar inimigo sem frota conhecida, quem diz que afundou é o adversário
      const afundou = mar ? navioAfundado(mar, tiros, mar[p])
                          : (jogo && jogo.afundadasDele.has(p));
      casa.classList.add(mostrarNavios ? "atingido" : (afundou ? "afundado" : "acerto"));
      casa.textContent = afundou ? "✖" : "✷";
    }

    if(aoClicar){
      const podeAtirar = !t;
      casa.disabled = !podeAtirar;
      casa.classList.toggle("aberta", podeAtirar);
      casa.setAttribute("aria-label",
        "Casa " + String.fromCharCode(65 + col(p)) + (lin(p) + 1) +
        (t ? (t === "agua" ? ", água" : ", acertada") : ""));
      casa.addEventListener("click", () => aoClicar(p));
    }
    container.appendChild(casa);
  }
}

function navioAfundado(mar, tiros, id){
  if(!mar || id === null || id === undefined) return false;
  for(let p = 0; p < N*N; p++)
    if(mar[p] === id && tiros[p] !== "acerto") return false;
  return true;
}

function desenharFrota(container, mar, tiros, afundadosSemMar){
  container.innerHTML = "";
  NAVIOS.forEach((nv, id) => {
    const caiu = mar ? (tiros && navioAfundado(mar, tiros, id))
                     : (afundadosSemMar !== undefined && id < afundadosSemMar);
    const b = document.createElement("span");
    b.className = "barco" + (caiu ? " afundado" : "");
    const casco = document.createElement("span");
    casco.className = "casco";
    for(let k = 0; k < nv.tam; k++) casco.appendChild(document.createElement("i"));
    const nome = document.createElement("span");
    nome.textContent = nv.nome;
    b.append(casco, nome);
    container.appendChild(b);
  });
}

/* ---------------------------------------------------------
   PREPARO
   --------------------------------------------------------- */

function montarPreparo(){
  const lista = $("#listaJogadores");
  lista.innerHTML = "";
  const linha = document.createElement("div");
  linha.className = "jogador-linha";

  const bola = document.createElement("span");
  bola.className = "bolinha"; bola.style.background = "var(--gold)";

  const nome = document.createElement("input");
  nome.type = "text"; nome.value = cfg.nome; nome.maxLength = 16;
  nome.setAttribute("aria-label", "Seu nome");
  nome.addEventListener("input", () => { cfg.nome = nome.value.trim() || "Você"; });

  const nivel = document.createElement("select");
  nivel.setAttribute("aria-label", "Nível");
  [[1,"Fácil"],[2,"Médio"],[3,"Difícil"]].forEach(([v,t]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = t;
    if(v === cfg.nivel) o.selected = true; nivel.appendChild(o);
  });
  nivel.addEventListener("change", () => { cfg.nivel = Number(nivel.value); });

  linha.append(bola, nome, nivel);
  lista.appendChild(linha);
}

function abrirPosicionamento(){
  jogo0.euPronto = false;
  $("#btnZarpar").disabled = false;
  $("#btnZarpar").textContent = "Zarpar";
  previewMar = sortearMar();
  desenharMar($("#marPreview"), previewMar, null, true, null);
  desenharFrota($("#frotaPreview"), previewMar, null);
  UI.trocarTela("telaPosicionar");
}

/* ---------------------------------------------------------
   PARTIDA
   --------------------------------------------------------- */

function zarpar(){
  if(online()){
    jogo0.euPronto = true;
    enviarRecado({tipo:"pronto", nome: cfg.nome});
    if(jogo0.elePronto) return iniciarOnline();
    $("#btnZarpar").disabled = true;
    $("#btnZarpar").textContent = "Esperando o outro aparelho posicionar…";
    return;
  }
  Banco.zerar();
  jogo = {
    meuMar: previewMar,
    marDela: sortearMar(),
    tirosDela: Array(N*N).fill(null),   // tiros da máquina no meu mar
    meusTiros: Array(N*N).fill(null),   // meus tiros no mar dela
    vez: "eu",
    fase: "mirar",
    pendente: null,
    fila: [],                            // casas que a máquina quer investigar
    ultimoAcerto: null
  };
  UI.trocarTela("telaJogo");
  $("#desfecho").innerHTML = "";
  redesenhar();
  Som.chegou();
  avisar(cfg.nome + ", escolha onde atirar.");
}

function redesenhar(){
  desenharMar($("#marInimigo"), jogo.marDela, jogo.meusTiros, false,
              jogo.vez === "eu" && jogo.fase === "mirar" ? mirar : null);
  desenharMar($("#marProprio"), jogo.meuMar, jogo.tirosDela, true, null);
  desenharFrota($("#frotaInimiga"), jogo.marDela, jogo.meusTiros, jogo.navioAfundados);
  desenharFrota($("#frotaPropria"), jogo.meuMar, jogo.tirosDela);
  atualizarLinha();
}

function contarAcertos(tiros){ return tiros.filter(t => t === "acerto").length; }

function atualizarLinha(){
  const meu = jogo.vez === "eu";
  $("#linhaInfo").style.setProperty("--vez-cor", meu ? "var(--gold)" : "var(--carmim-claro)");
  $("#infoBolinha").style.background = meu ? "var(--gold)" : "var(--carmim-claro)";
  const outro = jogo.eleNome || "Máquina";
  $("#infoNome").textContent = meu ? cfg.nome : outro;
  $("#infoSub").textContent = meu ? "sua vez de atirar" : outro + " está atirando";
  $("#infoContagem").innerHTML =
    "você acertou " + contarAcertos(jogo.meusTiros) + " de " + CASAS_COM_NAVIO + "<br>" +
    "ela acertou " + contarAcertos(jogo.tirosDela) + " de " + CASAS_COM_NAVIO;
}

function avisar(t){ $("#aviso").textContent = t || ""; }

/* ---------- meu tiro ---------- */

function mirar(p){
  if(jogo.fase !== "mirar" || jogo.vez !== "eu") return;
  if(online() && jogo.meusTiros[p]) return;
  if(jogo.meusTiros[p]) return;

  jogo.fase = "respondendo";
  jogo.pendente = p;
  Som.toque();
  const casa = $('#marInimigo .casa[data-p="' + p + '"]');
  if(casa) casa.classList.add("alvo");

  Sala.aoAbrirPergunta();
  Pergunta.abrir({
    para: cfg.nome,
    nivel: cfg.nivel,
    texto: a => a ? "Resposta certa. O tiro sai." : "Resposta errada. O tiro não sai e a vez passa.",
    aoResponder: (acertou) => {
      if(!acertou){
        Som.erro();
        avisar("A pergunta falhou. O tiro ficou no canhão.");
        Sala.aoFecharPergunta();
        if(online()){
          jogo.vez = "ele";
          jogo.fase = "mirar";   // sem isto o aparelho não aceita mirar de novo
          enviarRecado({tipo:"passou"});
          redesenhar();
          return avisar(avisoDaVez());
        }
        return passarVez();
      }
      Sala.aoFecharPergunta();
      if(online()){
        jogo.fase = "mirar";
        enviarRecado({tipo:"tiro", p});
        avisar("Tiro disparado. Esperando a resposta…");
        return;
      }
      atirar("eu", p);
    }
  });
}

function atirar(quem, p){
  const mar   = quem === "eu" ? jogo.marDela   : jogo.meuMar;
  const tiros = quem === "eu" ? jogo.meusTiros : jogo.tirosDela;
  const acertou = mar[p] !== null;
  tiros[p] = acertou ? "acerto" : "agua";

  const nomeCasa = String.fromCharCode(65 + col(p)) + (lin(p) + 1);
  const atirador = quem === "eu" ? cfg.nome : "A máquina";

  if(acertou){
    Som.marcar();
    const afundou = navioAfundado(mar, tiros, mar[p]);
    avisar(afundou
      ? atirador + " afundou o " + NAVIOS[mar[p]].nome + " em " + nomeCasa + "!"
      : atirador + " acertou um navio em " + nomeCasa + ".");
    if(afundou) Som.chegou();
    if(quem === "ele") registrarCacada(p, mar, tiros);
  } else {
    Som.toque();
    avisar(atirador + " caiu na água em " + nomeCasa + ".");
  }

  jogo.fase = "parado";
  redesenhar();

  if(contarAcertos(tiros) >= CASAS_COM_NAVIO)
    return setTimeout(() => fimDaPartida(quem), 1100);

  if(acertou){
    // quem acerta atira de novo
    setTimeout(() => {
      jogo.fase = "mirar";
      if(quem === "eu"){ redesenhar(); avisar("Acertou: atire outra vez."); }
      else vezDaMaquina();
    }, 1100);
  } else {
    setTimeout(passarVez, 1100);
  }
}

function passarVez(){
  jogo.vez = jogo.vez === "eu" ? "ele" : "eu";
  jogo.fase = "mirar";
  redesenhar();
  if(jogo.vez === "ele"){
    avisar("A máquina está mirando…");
    setTimeout(vezDaMaquina, 800);
  } else {
    avisar(cfg.nome + ", escolha onde atirar.");
  }
}

/* ---------- a máquina ---------- */

function registrarCacada(p, mar, tiros){
  // no fácil ela não persegue: acerta e continua atirando a esmo
  if(cfg.nivel === 1){
    if(navioAfundado(mar, tiros, mar[p])) jogo.ultimoAcerto = null;
    return;
  }
  // nos outros níveis, depois de acertar ela investiga as casas vizinhas
  const vizinhas = [];
  const l = lin(p), c = col(p);
  [[l-1,c],[l+1,c],[l,c-1],[l,c+1]].forEach(([a,b]) => {
    if(a >= 0 && a < N && b >= 0 && b < N){
      const q = a*N + b;
      if(!tiros[q]) vizinhas.push(q);
    }
  });

  // se já tem dois acertos em linha, segue a linha e descarta o resto
  if(jogo.ultimoAcerto !== null){
    const dl = lin(p) - lin(jogo.ultimoAcerto), dc = col(p) - col(jogo.ultimoAcerto);
    if(Math.abs(dl) + Math.abs(dc) === 1){
      const emLinha = vizinhas.filter(q => (lin(q) - l) === dl || (col(q) - c) === dc
                                        || (l - lin(q)) === dl || (c - col(q)) === dc);
      if(emLinha.length) jogo.fila = emLinha.concat(jogo.fila.filter(x => emLinha.includes(x)));
    }
  }
  jogo.fila = vizinhas.concat(jogo.fila);
  if(navioAfundado(mar, tiros, mar[p])){ jogo.fila = []; jogo.ultimoAcerto = null; }
  else jogo.ultimoAcerto = p;
}

function alvoDaMaquina(){
  while(jogo.fila.length){
    const p = jogo.fila.shift();
    if(!jogo.tirosDela[p]) return p;
  }
  const livres = [];
  const paridade = [];
  for(let p = 0; p < N*N; p++){
    if(jogo.tirosDela[p]) continue;
    livres.push(p);
    if((lin(p) + col(p)) % 2 === 0) paridade.push(p);
  }
  // no difícil ela varre em xadrez, que é a forma mais eficiente de procurar
  const usarParidade = cfg.nivel === 3 || (cfg.nivel === 2 && Math.random() < 0.6);
  const pool = (usarParidade && paridade.length) ? paridade : livres;
  return pool[Math.floor(Math.random() * pool.length)];
}

function vezDaMaquina(){
  if(jogo.vez !== "ele") return;
  const p = alvoDaMaquina();
  const acertouPergunta = Math.random() < ACERTO_MAQUINA[cfg.nivel];
  setTimeout(() => {
    if(!acertouPergunta){
      Som.erro();
      avisar("A máquina errou a pergunta e perdeu o tiro.");
      return setTimeout(passarVez, 1100);
    }
    atirar("ele", p);
  }, 550);
}

/* ---------- fim ---------- */

function fimDaPartida(vencedor){
  jogo.fase = "acabou";
  const ganhei = vencedor === "eu";
  if(ganhei) Som.vitoria(); else Som.pausa();
  $("#fimTitulo").textContent = ganhei ? cfg.nome + " venceu a batalha"
                                       : (jogo.eleNome || "A máquina") + " venceu";
  $("#fimSub").textContent =
    "Você acertou " + contarAcertos(jogo.meusTiros) + " de " + CASAS_COM_NAVIO +
    " · " + (jogo.eleNome || "a máquina") + " acertou " + contarAcertos(jogo.tirosDela) + " de " + CASAS_COM_NAVIO;
  UI.trocarTela("telaFim");
}

/* ---------------------------------------------------------
   SALA — aqui a sincronia é diferente de todos os outros jogos

   Nos demais, um aparelho descreve a partida inteira e o outro copia.
   Aqui isso seria trapaça: o retrato conteria o mar do adversário.

   Então cada aparelho guarda a própria frota e nunca a envia. O que
   viaja são recados curtos:
     tiro      — atirei na casa tal
     resultado — na sua casa tal foi água / acerto / afundou tal navio
     passou    — errei a pergunta, a vez é sua
     pronto    — minha frota está posicionada
   Quem sabe se um tiro acertou é o dono do mar, e só ele responde.
   --------------------------------------------------------- */

function online(){ return Sala.ativa(); }

function enviarRecado(msg){ if(Sala.ativa()) Sala.publicar(msg); }

function receberRecado(m){
  if(!m || !m.tipo) return;

  if(m.tipo === "pronto"){
    jogo0.eleNome = m.nome || "Jogador 2";
    jogo0.elePronto = true;
    if(jogo0.euPronto) iniciarOnline();
    else avisar("O outro aparelho já posicionou a frota.");
    return;
  }

  if(!jogo) return;

  if(m.tipo === "tiro"){
    // o tiro é no MEU mar: só eu sei o que tem lá
    const p = m.p;
    if(jogo.tirosDela[p]) return;
    const acertou = jogo.meuMar[p] !== null;
    jogo.tirosDela[p] = acertou ? "acerto" : "agua";
    const id = jogo.meuMar[p];
    const afundou = acertou && navioAfundado(jogo.meuMar, jogo.tirosDela, id);
    const celulas = [];
    if(afundou) for(let q = 0; q < N*N; q++) if(jogo.meuMar[q] === id) celulas.push(q);
    const perdi = contarAcertos(jogo.tirosDela) >= CASAS_COM_NAVIO;

    enviarRecado({tipo:"resultado", p, acertou, afundou, navio: afundou ? NAVIOS[id].nome : null,
                  celulas, acabou: perdi});

    if(acertou){ Som.marcar(); if(afundou) Som.chegou(); }
    else Som.toque();
    const nome = String.fromCharCode(65 + col(p)) + (lin(p) + 1);
    avisar(afundou ? jogo.eleNome + " afundou o " + NAVIOS[id].nome + " em " + nome + "!"
         : acertou ? jogo.eleNome + " acertou um navio em " + nome + "."
                   : jogo.eleNome + " caiu na água em " + nome + ".");
    jogo.vez = acertou ? "ele" : "eu";
    jogo.fase = "mirar";
    if(perdi) return setTimeout(() => fimDaPartida("ele"), 900);
    redesenhar();
    return;
  }

  if(m.tipo === "resultado"){
    jogo.meusTiros[m.p] = m.acertou ? "acerto" : "agua";
    if(m.afundou){
      m.celulas.forEach(q => jogo.afundadasDele.add(q));
      jogo.navioAfundados++;
    }
    const nome = String.fromCharCode(65 + col(m.p)) + (lin(m.p) + 1);
    if(m.acertou){ Som.marcar(); if(m.afundou) Som.chegou(); }
    else Som.toque();
    avisar(m.afundou ? "Você afundou o " + m.navio + " em " + nome + "!"
         : m.acertou ? "Você acertou um navio em " + nome + "."
                     : "Você caiu na água em " + nome + ".");
    jogo.vez = m.acertou ? "eu" : "ele";
    jogo.fase = "mirar";
    if(m.acabou) return setTimeout(() => fimDaPartida("eu"), 900);
    redesenhar();
    if(jogo.vez === "eu") avisar(avisoDaVez());
    return;
  }

  if(m.tipo === "passou"){
    avisar(jogo.eleNome + " errou a pergunta e perdeu o tiro.");
    jogo.vez = "eu";
    jogo.fase = "mirar";
    redesenhar();
    setTimeout(() => avisar(avisoDaVez()), 900);
    return;
  }
}

function avisoDaVez(){
  return jogo.vez === "eu" ? cfg.nome + ", escolha onde atirar."
                           : jogo.eleNome + " está mirando…";
}

/* guarda o que se sabe antes de a partida existir */
const jogo0 = { euPronto:false, elePronto:false, eleNome:"Jogador 2" };

function iniciarOnline(){
  Banco.zerar();
  jogo = {
    meuMar: previewMar,
    marDela: null,                 // não existe deste lado, e é essa a graça
    tirosDela: Array(N*N).fill(null),
    meusTiros: Array(N*N).fill(null),
    afundadasDele: new Set(),
    navioAfundados: 0,
    eleNome: jogo0.eleNome,
    vez: Sala.meuLugar === 0 ? "eu" : "ele",
    fase: "mirar",
    pendente: null
  };
  UI.trocarTela("telaJogo");
  $("#desfecho").innerHTML = "";
  redesenhar();
  Som.chegou();
  avisar(avisoDaVez());
}

   --------------------------------------------------------- */

  retratar: () => null,                 // aqui não se publica estado, só recados
  aplicar: (m) => receberRecado(m),
  aoMudarGente: (n) => { if(jogo && jogo.fase !== "acabou" && n < 2) avisar("O outro aparelho saiu da sala."); },
  aoLigar: (lugar) => {
    $("#btnPosicionar").textContent = "Posicionar a frota (você é o jogador " + (lugar + 1) + ")";
  },
  aoDesligar: () => {
    if(Sala.ativa()) Sala.fechar();
    jogo0.euPronto = jogo0.elePronto = false;
    $("#btnPosicionar").textContent = "Posicionar a frota";
  }
});

$("#btnPosicionar").addEventListener("click", abrirPosicionamento);

  previewMar = sortearMar();
  desenharMar($("#marPreview"), previewMar, null, true, null);
  Som.toque();
});
$("#btnZarpar").addEventListener("click", zarpar);
$("#btnSair").addEventListener("click", () => UI.trocarTela("telaPreparo"));
$("#btnDeNovo").addEventListener("click", abrirPosicionamento);
$("#btnVoltarPreparo").addEventListener("click", () => UI.trocarTela("telaPreparo"));

montarPreparo();
